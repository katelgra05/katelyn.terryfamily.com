<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maze Escape</title>
  <link rel="stylesheet" href="./pixll-shell.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #f0f4ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      min-height: 100dvh;
      height: auto;
    }
    .container {
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      padding: 70px 12px 24px 12px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: none;
      width: 100%;
      box-sizing: border-box;
    }
    .container h1 {
      display: none; /* badge in the topbar names the game */
    }
    #maze {
      display: grid;
      margin: 20px auto;
      background: #dbeafe;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      touch-action: pan-y;
    }
    .cell {
      width: var(--cell, 32px);
      height: var(--cell, 32px);
      box-sizing: border-box;
      border: 1px solid #b3b3b3;
      background: #fff;
      transition: background 0.2s;
    }
    .cell.wall {
      background: #6366f1;
    }
    .cell.visited {
      background: #dcfce7;
    }
    .cell.player {
      background: #4ade80;
    }
    .cell.exit {
      background: #facc15;
      animation: exitPulse 1.2s infinite;
    }
    @keyframes exitPulse {
      0%, 100% { box-shadow: inset 0 0 0 0 rgba(250,204,21,0.7); }
      50% { box-shadow: inset 0 0 0 6px rgba(250,204,21,0.9); }
    }
    .maze-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    #mazeBest {
      font-weight: bold;
      color: #7c3aed;
    }
    .info {
      margin: 10px 0 0 0;
      font-size: 1.1rem;
    }
    button {
      padding: 10px 28px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <nav class="pixll-topbar"><a href="../index.html" class="pixll-back">← Pixll Arcade</a><span class="pixll-badge">✨ Pixll • 🌀 Maze Escape</span></nav>
  <header class="pixll-hero">
    <div class="pixll-hero-emoji">🌀</div>
    <h2 class="pixll-hero-title">Maze Escape</h2>
    <p class="pixll-hero-tag">Find the golden exit as fast as you can! Use arrow keys or WASD to move.</p>
    <div class="pixll-how"><span class="pixll-chip">⬆️⬇️⬅️➡️ Move</span><span class="pixll-chip">🟨 Exit</span><span class="pixll-chip">⏱️ Beat your time</span></div>
  </header>
  <div class="container">
    <h1>🌀 Maze Escape</h1>
    <div class="info maze-toolbar">
      <span id="timer">Time: 0.00s</span>
      <span id="mazeLevel">Maze 1</span>
      <span id="mazeBest">🏆 —</span>
    </div>
    <div class="info maze-toolbar">
      <button id="restartBtn">↺ Restart</button>
      <button id="nextBtn" style="display:none;">Next Maze ▶</button>
      <button id="muteBtn" title="Sound on/off">🔊</button>
    </div>
    <div id="maze"></div>
    <div class="info" id="message"></div>
    <div class="info" style="font-size:0.95rem;color:#555;">⌨️ Arrows / WASD &nbsp;•&nbsp; 👆 Swipe on touch screens</div>
  </div>
  <script>
    // ---- tiny synth sounds ----
    let mazeAudio = null, mazeMuted = false;
    try { mazeMuted = localStorage.getItem('maze_muted') === '1'; } catch (e) {}
    function mazeTone(freq, dur, type, vol, delay) {
      if (mazeMuted) return;
      try {
        if (!mazeAudio) mazeAudio = new (window.AudioContext || window.webkitAudioContext)();
        const t = mazeAudio.currentTime + (delay || 0);
        const osc = mazeAudio.createOscillator();
        const gain = mazeAudio.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(vol || 0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(mazeAudio.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
      } catch (e) {}
    }
    function bumpSound() { mazeTone(140, 0.07, 'square', 0.05); }
    function winSound() {
      mazeTone(523, 0.12, 'triangle', 0.11); mazeTone(659, 0.12, 'triangle', 0.11, 0.1);
      mazeTone(784, 0.2, 'triangle', 0.11, 0.2);
    }

    let rows, cols;
    let level = 1;
    let visitedCells = new Set(['0,0']);
    function setSize() {
      rows = Math.min(13 + level * 2, 25); // L1 = 15x20, grows to 25x34
      cols = Math.min(18 + level * 2, 34);
    }
    function cellSize() {
      const vw = Math.min(window.innerWidth, 1100) - 24;
      const vh = (window.innerHeight || 800) - 300; // room for topbar + toolbar + hints
      return Math.max(14, Math.min(40, Math.floor(vw / cols), Math.floor(vh / rows)));
    }
    function bestKey() { return 'maze_best_' + level; }
    function loadBest() {
      try { const v = localStorage.getItem(bestKey()); return v === null ? 0 : parseFloat(v); }
      catch (e) { return 0; }
    }
    function renderBest() {
      const b = loadBest();
      document.getElementById('mazeBest').textContent = b ? `🏆 ${b.toFixed(2)}s` : '🏆 —';
    }
    let maze = [], player = {x: 0, y: 0}, exit = {x: 19, y: 14};
    let timer = 0, timerInterval, gameActive = true;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateMaze() {
      let attempts = 0;
      const maxAttempts = 10;
      
      function tryGenerateMaze() {
        // Initialize with all walls
        maze = Array.from({length: rows}, () => Array(cols).fill(1));
        
        function carve(x, y) {
          maze[y][x] = 0;
          const directions = shuffle([[0,1],[1,0],[0,-1],[-1,0]]);
          for (const [dx, dy] of directions) {
            const nx = x + dx*2, ny = y + dy*2;
            if (ny >= 0 && ny < rows && nx >= 0 && nx < cols && maze[ny][nx] === 1) {
              // Carve the path and the wall between
              maze[y+dy][x+dx] = 0;
              maze[ny][nx] = 0;
              carve(nx, ny);
            }
          }
        }

        // Start from a random point
        const startX = Math.floor(Math.random() * (cols/2));
        const startY = Math.floor(Math.random() * (rows/2));
        carve(startX*2, startY*2);

        // Ensure start and exit are clear and connected
        maze[0][0] = 0;
        maze[rows-1][cols-1] = 0;
        
        // Connect start and exit to the maze
        function connectToMaze(x, y) {
          const directions = shuffle([[0,1],[1,0],[0,-1],[-1,0]]);
          for (const [dx, dy] of directions) {
            const nx = x + dx, ny = y + dy;
            if (ny >= 0 && ny < rows && nx >= 0 && nx < cols && maze[ny][nx] === 0) {
              maze[y][x] = 0;
              return true;
            }
          }
          return false;
        }

        // Keep trying to connect start and exit until successful
        while (!connectToMaze(0, 0) || !connectToMaze(cols-1, rows-1)) {
          // If we can't connect, add a new path
          const x = Math.floor(Math.random() * cols);
          const y = Math.floor(Math.random() * rows);
          if (maze[y][x] === 1) {
            maze[y][x] = 0;
          }
        }
      }

      do {
        tryGenerateMaze();
        attempts++;
      } while (!isExitReachable() && attempts < maxAttempts);

      // If we still don't have a valid maze after max attempts, create a simple maze
      if (!isExitReachable()) {
        maze = Array.from({length: rows}, () => Array(cols).fill(1));
        // Create a simple maze with alternating walls
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            if (y % 2 === 0 || x % 2 === 0) {
              maze[y][x] = 0;
            }
          }
        }
        // Ensure start and exit are clear
        maze[0][0] = 0;
        maze[rows-1][cols-1] = 0;
      }
    }

    function isExitReachable() {
      const visited = Array.from({length: rows}, () => Array(cols).fill(false));
      
      function dfs(x, y) {
        if (x === exit.x && y === exit.y) return true;
        if (x < 0 || x >= cols || y < 0 || y >= rows || maze[y][x] === 1 || visited[y][x]) return false;
        
        visited[y][x] = true;
        return dfs(x+1, y) || dfs(x-1, y) || dfs(x, y+1) || dfs(x, y-1);
      }
      
      return dfs(0, 0);
    }

    function drawMaze() {
      const mazeDiv = document.getElementById('maze');
      mazeDiv.innerHTML = '';
      const cs = cellSize();
      mazeDiv.style.setProperty('--cell', cs + 'px');
      mazeDiv.style.gridTemplateRows = `repeat(${rows}, ${cs}px)`;
      mazeDiv.style.gridTemplateColumns = `repeat(${cols}, ${cs}px)`;
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell' + (maze[y][x] ? ' wall' : '');
          if (visitedCells.has(x + ',' + y) && !maze[y][x]) cell.classList.add('visited');
          if (player.x === x && player.y === y) cell.classList.add('player');
          if (exit.x === x && exit.y === y) cell.classList.add('exit');
          mazeDiv.appendChild(cell);
        }
      }
    }

    function startGame() {
      setSize();
      exit = {x: cols-1, y: rows-1};
      generateMaze();
      player = {x: 0, y: 0};
      exit = {x: cols-1, y: rows-1};
      visitedCells = new Set(['0,0']);
      timer = 0;
      gameActive = true;
      document.getElementById('message').textContent = '';
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('mazeLevel').textContent = 'Maze ' + level;
      renderBest();
      document.getElementById('timer').textContent = 'Time: 0.00s';
      drawMaze();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer += 0.01;
        document.getElementById('timer').textContent = `Time: ${timer.toFixed(2)}s`;
      }, 10);
    }

    function movePlayer(dx, dy) {
      if (!gameActive) return;
      const nx = player.x + dx, ny = player.y + dy;
      if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && maze[ny][nx] === 0) {
        player.x = nx;
        player.y = ny;
        visitedCells.add(nx + ',' + ny);
        drawMaze();
        if (player.x === exit.x && player.y === exit.y) {
          clearInterval(timerInterval);
          gameActive = false;
          winSound();
          const prev = loadBest();
          let extra = '';
          if (!prev || timer < prev) {
            try { localStorage.setItem(bestKey(), String(timer)); } catch (e) {}
            extra = ' 🏆 New best!';
          } else {
            extra = ` (best ${prev.toFixed(2)}s)`;
          }
          renderBest();
          document.getElementById('message').textContent = `You escaped maze ${level} in ${timer.toFixed(2)} seconds!${extra}`;
          document.getElementById('nextBtn').style.display = 'inline-block';
        }
      } else {
        bumpSound(); // bonked a wall
      }
    }

    const KEY_DIRS = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
      W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
    };
    document.addEventListener('keydown', e => {
      if (!gameActive) return;
      const dir = KEY_DIRS[e.key];
      if (dir) {
        e.preventDefault();
        movePlayer(dir[0], dir[1]);
      }
    });

    // swipe to move on touch screens
    (function setupSwipe() {
      const mazeDiv = document.getElementById('maze');
      let sx = 0, sy = 0;
      mazeDiv.addEventListener('touchstart', e => {
        const t = e.changedTouches[0];
        sx = t.clientX; sy = t.clientY;
      }, { passive: true });
      mazeDiv.addEventListener('touchend', e => {
        const t = e.changedTouches[0];
        const dx = t.clientX - sx, dy = t.clientY - sy;
        if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) movePlayer(dx > 0 ? 1 : -1, 0);
        else movePlayer(0, dy > 0 ? 1 : -1);
      });
    })();

    document.getElementById('restartBtn').onclick = () => { level = 1; startGame(); };
    document.getElementById('nextBtn').onclick = () => { level++; startGame(); };
    document.getElementById('muteBtn').textContent = mazeMuted ? '🔇' : '🔊';
    document.getElementById('muteBtn').onclick = () => {
      mazeMuted = !mazeMuted;
      try { localStorage.setItem('maze_muted', mazeMuted ? '1' : '0'); } catch (e) {}
      document.getElementById('muteBtn').textContent = mazeMuted ? '🔇' : '🔊';
    };

    startGame();
  </script>
</body>
</html>
