<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Scramble</title>
  <link rel="stylesheet" href="./pixll-shell.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #f0f4ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 70px 12px 26px 12px;
      box-sizing: border-box;
    }
    .container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: clamp(24px, 5vmin, 48px) clamp(20px, 5vmin, 44px);
      text-align: center;
      width: min(94vw, 640px);
      box-sizing: border-box;
    }
    .container h1 {
      font-size: clamp(26px, 5vmin, 38px);
    }
    .scrambled {
      font-size: clamp(2rem, 8vmin, 3.2rem);
      font-weight: bold;
      letter-spacing: 4px;
      color: #6366f1;
      margin-bottom: 24px;
    }
    input[type="text"] {
      font-size: clamp(1.2rem, 3.4vmin, 1.6rem);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #b3b3b3;
      margin-bottom: 16px;
      width: min(280px, 60vw);
      text-align: center;
    }
    button {
      padding: 10px 28px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-left: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
    .score {
      font-size: 1.1rem;
      color: #333;
      margin-top: 18px;
    }
    .streak {
      font-size: 1.05rem;
      color: #7c3aed;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .hint {
      font-size: 1.05rem;
      color: #0d9488;
      font-weight: bold;
      min-height: 26px;
      margin-bottom: 10px;
    }
    .btn-row {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .tool-btn {
      background: #e5e7eb !important;
      color: #111 !important;
      margin-left: 0 !important;
    }
    .message {
      font-size: 1.1rem;
      margin-top: 10px;
      color: #10b981;
    }
    .message.wrong {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <nav class="pixll-topbar"><a href="../index.html" class="pixll-back">← Pixll Arcade</a><span class="pixll-badge">✨ Pixll • 🔤 Word Scramble</span></nav>
  <header class="pixll-hero">
    <div class="pixll-hero-emoji">🔤</div>
    <h2 class="pixll-hero-title">Word Scramble</h2>
    <p class="pixll-hero-tag">Unscramble the letters — press Enter to guess! How many can you solve in a row?</p>
    <div class="pixll-how"><span class="pixll-chip">🔤 Unscramble</span><span class="pixll-chip">⏎ Enter to guess</span><span class="pixll-chip">🏆 Streak scoring</span></div>
  </header>
  <div class="container">
    <h1>🔤 Word Scramble</h1>
    <div class="streak" id="streak">🔥 Streak: 0 &nbsp;•&nbsp; 🏆 Best: 0</div>
    <div class="scrambled" id="scrambledWord">Loading...</div>
    <div class="hint" id="hint"></div>
    <input type="text" id="guessInput" placeholder="Your guess">
    <button id="submitBtn">Guess</button>
    <div class="btn-row">
      <button id="hintBtn" class="tool-btn">💡 Hint</button>
      <button id="skipBtn" class="tool-btn">⏭ Skip</button>
      <button id="muteBtn" class="tool-btn" title="Sound on/off">🔊</button>
    </div>
    <div class="message" id="message"></div>
    <div class="score" id="score">Score: 0</div>
  </div>
  <script>
    const words = [
      'banana', 'computer', 'javascript', 'family', 'puzzle', 'ocean', 'mountain', 'school', 'friend', 'holiday',
      'guitar', 'window', 'picture', 'library', 'garden', 'rocket', 'planet', 'animal', 'forest', 'summer'
    ];
    let currentWord = '', scrambled = '', score = 0;
    let streak = 0, hintsUsed = 0;
    let best = 0, wsMuted = false;
    try {
      best = parseInt(localStorage.getItem('ws_best')) || 0;
      wsMuted = localStorage.getItem('ws_muted') === '1';
    } catch (e) {}

    // ---- tiny synth sounds ----
    let wsAudio = null;
    function wsTone(freq, dur, type, vol, delay) {
      if (wsMuted) return;
      try {
        if (!wsAudio) wsAudio = new (window.AudioContext || window.webkitAudioContext)();
        const t = wsAudio.currentTime + (delay || 0);
        const osc = wsAudio.createOscillator();
        const gain = wsAudio.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(vol || 0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(wsAudio.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
      } catch (e) {}
    }
    function renderStreak() {
      document.getElementById('streak').textContent = `🔥 Streak: ${streak}  •  🏆 Best: ${best}`;
    }

    function scramble(word) {
      let arr = word.split('');
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.join('');
    }

    function newWord() {
      currentWord = words[Math.floor(Math.random() * words.length)];
      scrambled = scramble(currentWord);
      // Ensure scrambled word is not the same as the original
      while (scrambled === currentWord) scrambled = scramble(currentWord);
      document.getElementById('scrambledWord').textContent = scrambled;
      document.getElementById('guessInput').value = '';
      document.getElementById('message').textContent = '';
      hintsUsed = 0;
      document.getElementById('hint').textContent = '';
    }

    document.getElementById('submitBtn').onclick = function() {
      const guess = document.getElementById('guessInput').value.trim().toLowerCase();
      if (!guess) return;
      if (guess === currentWord) {
        score++;
        streak++;
        if (streak > best) {
          best = streak;
          try { localStorage.setItem('ws_best', String(best)); } catch (e) {}
        }
        renderStreak();
        wsTone(523, 0.1, 'triangle', 0.11);
        wsTone(784, 0.16, 'triangle', 0.11, 0.08);
        document.getElementById('message').textContent = streak >= 3 ? `Correct! 🔥 x${streak} streak!` : 'Correct!';
        document.getElementById('message').className = 'message';
        document.getElementById('score').textContent = 'Score: ' + score;
        setTimeout(newWord, 1000);
      } else {
        streak = 0;
        renderStreak();
        wsTone(200, 0.15, 'sawtooth', 0.07);
        document.getElementById('message').textContent = 'Try again!';
        document.getElementById('message').className = 'message wrong';
      }
    };

    document.getElementById('hintBtn').onclick = function() {
      if (hintsUsed < currentWord.length - 1) {
        hintsUsed++;
        wsTone(700, 0.08, 'sine', 0.08);
        document.getElementById('hint').textContent =
          `💡 ${currentWord.slice(0, hintsUsed)}${'_'.repeat(currentWord.length - hintsUsed)} (${currentWord.length} letters)`;
      } else {
        document.getElementById('hint').textContent = `💡 The word has ${currentWord.length} letters!`;
      }
    };

    document.getElementById('skipBtn').onclick = function() {
      newWord();
      document.getElementById('guessInput').focus();
    };

    document.getElementById('muteBtn').textContent = wsMuted ? '🔇' : '🔊';
    document.getElementById('muteBtn').onclick = function() {
      wsMuted = !wsMuted;
      try { localStorage.setItem('ws_muted', wsMuted ? '1' : '0'); } catch (e) {}
      document.getElementById('muteBtn').textContent = wsMuted ? '🔇' : '🔊';
    };

    renderStreak();

    document.getElementById('guessInput').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') document.getElementById('submitBtn').click();
    });

    newWord();
  </script>
</body>
</html>
