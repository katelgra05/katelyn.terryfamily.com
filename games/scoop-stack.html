<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scoop Stack - Katelyn's Games</title>
  <link rel="icon" type="image/png" href="../pixll-logo.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    .pixll-topbar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5000;
      pointer-events: none;
      font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    }
    .pixll-topbar > * { pointer-events: auto; }
    .pixll-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(10, 8, 30, 0.72);
      color: #fff !important;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.18s ease;
    }
    .pixll-back:hover { transform: scale(1.05); }
    .pixll-badge {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .game-container {
      position: relative;
      margin: 0;
      width: 100vw;
      flex: 1;
      min-height: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: pointer;
    }
    .hud {
      position: absolute;
      top: 60px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 5;
    }
    .hud > * { pointer-events: auto; }
    .score-card {
      background: rgba(10, 8, 30, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 10px 16px;
      color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .score-card .scoops {
      font-size: clamp(24px, 4.6vmin, 34px);
      font-weight: 900;
    }
    .score-card .best-line {
      font-size: clamp(12px, 2.4vmin, 15px);
      opacity: 0.85;
    }
    .hud-right {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease;
    }
    .icon-btn:hover { transform: scale(1.1); }
    .icon-btn.off { opacity: 0.55; }
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      background: linear-gradient(160deg, rgba(20,12,50,0.94), rgba(48,43,99,0.94));
      border: 1px solid rgba(255,255,255,0.2);
      padding: 34px 32px;
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      max-width: min(92vw, 440px);
      z-index: 10;
    }
    .overlay h2 {
      font-size: 32px;
      margin: 0 0 10px;
      background: linear-gradient(90deg, #ffb3e2, #8ee7fa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .overlay p { color: rgba(255,255,255,0.85); font-size: 15px; }
    .overlay .big-score { font-size: 22px; font-weight: 900; color: #ffd94d; }
    .game-button {
      padding: 15px 38px;
      font-size: 20px;
      background: linear-gradient(135deg, #66e6ff, #7cf29b);
      color: #071018;
      font-weight: 900;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(102,230,255,0.4);
      transition: transform 0.15s ease;
      margin-top: 10px;
    }
    .game-button:hover { transform: scale(1.06); }
  </style>
</head>
<body>
  <nav class="pixll-topbar"><a href="../index.html" class="pixll-back">← Pixll Arcade</a><span class="pixll-badge">✨ Pixll • 🍨 Scoop Stack</span></nav>
  <div class="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="score-card">
        <div class="scoops">🍨 <span id="score">0</span></div>
        <div class="best-line">🏆 Best: <span id="best">0</span></div>
      </div>
      <div class="hud-right">
        <button id="muteBtn" class="icon-btn" onclick="toggleMute()" title="Sounds on/off">🔊</button>
      </div>
    </div>
    <div class="overlay" id="startScreen">
      <div style="font-size:52px;margin-bottom:8px;">🍨</div>
      <h2>Scoop Stack!</h2>
      <p>Slide the cone 👈👉 to catch falling scoops!<br>
      Caught scoops fly up onto your sundae tower!<br>
      Keep the tower balanced or it topples! ⚖️</p>
      <button class="game-button" onclick="startGame()">▶ Start Stacking!</button>
    </div>
    <div class="overlay" id="overScreen" style="display:none;">
      <div style="font-size:52px;margin-bottom:8px;">💦</div>
      <h2 id="overTitle">Splat!</h2>
      <p class="big-score">🍨 <span id="finalScore">0</span> scoops</p>
      <p id="newBest" style="font-weight:bold;color:#ffd94d;display:none;">🎉 New best! 🎉</p>
      <p style="color:rgba(255,255,255,0.85);">🏆 Best: <span id="finalBest">0</span></p>
      <button class="game-button" onclick="startGame()">↻ Stack Again!</button>
    </div>
  </div>

  <script>
    // ============ setup ============
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const finalScoreEl = document.getElementById('finalScore');
    const finalBestEl = document.getElementById('finalBest');
    const newBestEl = document.getElementById('newBest');
    const startScreen = document.getElementById('startScreen');
    const overScreen = document.getElementById('overScreen');
    const overTitleEl = document.getElementById('overTitle');
    const muteBtn = document.getElementById('muteBtn');

    let W = 0, H = 0;
    function resizeCanvas() {
      W = canvas.width = window.innerWidth || 800;
      H = canvas.height = window.innerHeight || 600;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ============ state ============
    let running = false, over = false, rafId = null, lastT = 0;
    let blocks = [], cur = null, placing = null, debris = [], popups = [], splats = [];
    let level = 0, best = 0, lean = 0, coneX = 0, camY = 0;
    let dragging = false, lastPX = 0;
    const keys = { left: false, right: false };
    let muted = false;
    try {
      best = parseInt(localStorage.getItem('scoop_best')) || 0;
      muted = localStorage.getItem('scoop_muted') === '1';
    } catch (e) {}

    const BLOCK_H = 46;
    const PERFECT_TOL = 9;
    const KEY_SPEED = 460;
    const maxLean = () => baseWidth() * 0.6;
    const FLAVORS = [
      { c: '#ff8ab5', d: '#e0559a' },
      { c: '#9ff0c8', d: '#3fbf7f' },
      { c: '#c9a06a', d: '#7a5230' },
      { c: '#fff6d8', d: '#e3c878' },
      { c: '#b9a7f2', d: '#7c5cd6' },
      { c: '#ffe066', d: '#eaa50f' }
    ];
    const SPRINKLE_COLORS = ['#ff5d5d', '#4aa8ff', '#ffd94d', '#7cf29b', '#ffffff', '#c084fc'];
    const flavorFor = i => FLAVORS[i % FLAVORS.length];
    const baseWidth = () => Math.min(W * 0.3, 110);
    const fallSpeed = lvl => Math.min(280 + lvl * 15, 620);
    const coneMouthW = () => baseWidth();
    // cone is glued to the bottom of the SCREEN — x only, never up/down
    const coneSY = () => H - 130;
    const coneWY = () => camY + coneSY();
    const groundY = () => H * 0.86;
    const clampCone = () => {
      const half = baseWidth() / 2 + 8;
      coneX = Math.max(half, Math.min(W - half, coneX));
    };

    function srand(seed) {
      let s = (seed * 1664525 + 1013904223) >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    // ============ audio ============
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function tone(freq, dur, type, vol, when, slideTo) {
      if (muted || !audioCtx) return;
      try {
        const t = (when || audioCtx.currentTime);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        gain.gain.setValueAtTime(vol || 0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
      } catch (e) {}
    }
    const sndPlace = () => tone(320, 0.08, 'triangle', 0.12);
    const sndPerfect = () => {
      if (!audioCtx) return;
      tone(660, 0.09, 'sine', 0.12);
      tone(990, 0.12, 'sine', 0.12, audioCtx.currentTime + 0.08);
    };
    const sndFall = () => tone(400, 0.4, 'sawtooth', 0.06, 0, 90);
    function toggleMute() {
      muted = !muted;
      try { localStorage.setItem('scoop_muted', muted ? '1' : '0'); } catch (e) {}
      muteBtn.textContent = muted ? '🔇' : '🔊';
      muteBtn.classList.toggle('off', muted);
    }

    // ============ gameplay ============
    function startGame() {
      ensureAudio();
      cancelAnimationFrame(rafId);
      resizeCanvas();
      const w = baseWidth();
      blocks = [{ x: W / 2 - w / 2, w, lvl: 0 }];
      level = 0;
      lean = 0;
      coneX = W / 2;
      placing = null;
      debris = [];
      popups = [];
      splats = [];
      camY = topWorldY() - H * 0.42;
      over = false;
      running = true;
      startScreen.style.display = 'none';
      overScreen.style.display = 'none';
      spawnCurrent();
      updateHUD();
      lastT = performance.now();
      rafId = requestAnimationFrame(loop);
    }

    function spawnCurrent() {
      // scoop drops from the top of the screen at a random, always-reachable spot
      const w = baseWidth();
      const reach = KEY_SPEED * ((coneWY() - (camY - 80)) / fallSpeed(level)) * 0.8;
      const lo = Math.max(w / 2, coneX - reach);
      const hi = Math.min(W - w / 2, coneX + reach);
      const cx = lo + Math.random() * Math.max(1, hi - lo);
      cur = { x: cx - w / 2, w, lvl: level + 1, wy: camY - 80 };
    }

    function topWorldY() {
      return groundY() - blocks.length * BLOCK_H;
    }

    // caught in the cone? the scoop flies up onto the freestanding tower
    function tryTouch() {
      if (!running || over || !cur || placing) return;
      const scoopCX = cur.x + cur.w / 2;
      const scoopCY = cur.wy + BLOCK_H / 2;
      const cwy = coneWY();
      if (Math.abs(scoopCY - cwy) < 52 && Math.abs(scoopCX - coneX) < (coneMouthW() + cur.w) / 2 - 6) {
        placing = { sx: cur.x, sy: cur.wy, w: cur.w, lvl: cur.lvl, t: 0, touchDX: scoopCX - coneX };
        cur = null;
        tone(880, 0.09, 'square', 0.06);
        if (audioCtx) tone(1318, 0.12, 'square', 0.06, audioCtx.currentTime + 0.06);
      }
    }

    // the caught scoop lands on top of the tower (which never moves itself)
    function finishPlacing() {
      const p = placing;
      placing = null;
      const prev = blocks[blocks.length - 1];
      const prevCX = prev.x + prev.w / 2;
      const off = Math.max(-p.w * 0.7, Math.min(p.w * 0.7, p.touchDX * 0.45));
      lean = lean * 0.85 + off;
      if (Math.abs(off) <= PERFECT_TOL) {
        blocks.push({ x: prevCX - p.w / 2, w: p.w, lvl: p.lvl });
        lean *= 0.4;
        popups.push({ x: prevCX, wy: topWorldY(), text: '✨ Perfect!', life: 1 });
        sndPerfect();
      } else {
        blocks.push({ x: prevCX + off - p.w / 2, w: p.w, lvl: p.lvl });
        sndPlace();
        if (Math.abs(lean) > maxLean() * 0.65) {
          popups.push({ x: prevCX + off, wy: topWorldY(), text: '😬 Wobbly!', life: 1 });
        }
      }
      level++;
      if (level > best) {
        best = level;
        try { localStorage.setItem('scoop_best', String(best)); } catch (e) {}
      }
      updateHUD();
      if (Math.abs(lean) > maxLean()) {
        // leaned too far — the whole tower topples!
        topple();
        gameOver('topple');
        return;
      }
      spawnCurrent();
    }

    function topple() {
      const dir = lean >= 0 ? 1 : -1;
      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        debris.push({
          x: b.x, w: b.w, lvl: b.lvl, noSplat: true,
          wy: groundY() - (i + 1) * BLOCK_H,
          vx: dir * (120 + Math.random() * 140), vy: -60 - i * 34,
          rot: 0, vr: dir * (2 + Math.random() * 3), life: 1.8
        });
      }
      blocks = [];
      cur = null;
      placing = null;
      tone(300, 0.5, 'sawtooth', 0.07, 0, 70);
    }

    function gameOver(reason) {
      over = true;
      running = false;
      cancelAnimationFrame(rafId);
      overTitleEl.textContent = reason === 'topple' ? '🍨 Timber!' : '💦 Splat!';
      // let things fall for a beat, then show the panel
      let shown = false;
      const finish = () => {
        if (shown) return;
        shown = true;
        finalScoreEl.textContent = level;
        finalBestEl.textContent = best;
        newBestEl.style.display = (level > 0 && level >= best) ? '' : 'none';
        overScreen.style.display = '';
      };
      setTimeout(finish, 650);
      updateHUD();
    }

    function updateHUD() {
      scoreEl.textContent = level;
      bestEl.textContent = best;
    }

    // ============ update ============
    function update(dt) {
      if (!over) {
        // slide the cone (it may leave the screen as the tower climbs!)
        if (keys.left) coneX -= KEY_SPEED * dt;
        if (keys.right) coneX += KEY_SPEED * dt;
        clampCone();
      }
      if (cur && !over) {
        // scoop falls straight down from the top of the screen
        cur.wy += fallSpeed(level) * dt;
        tryTouch();
        if (cur && cur.wy > coneWY() + 70) {
          // slipped right past the cone — SPLAT!
          splats.push({ x: cur.x + cur.w / 2, wy: coneWY() + 34, w: cur.w, lvl: cur.lvl, life: 2 });
          popups.push({ x: cur.x + cur.w / 2, wy: coneWY() - 40, text: '💦 Splat!', life: 1 });
          if (splats.length > 12) splats.splice(0, splats.length - 12);
          cur = null;
          sndFall();
          gameOver('miss');
        }
      }
      if (placing && !over) {
        // caught scoop flies up onto the tower
        placing.t += dt / 0.24;
        if (placing.t >= 1) finishPlacing();
      }
      // camera scrolls up with the tower like someone scrolling
      const target = topWorldY() - H * 0.42;
      camY += (target - camY) * Math.min(1, dt * 4);
      // debris physics
      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.wy += d.vy * dt;
        d.x += d.vx * dt;
        d.vy += 1800 * dt;
        d.rot += d.vr * dt;
        d.life -= dt;
        if (!d.noSplat && d.vy > 0 && d.wy + BLOCK_H >= groundY()) {
          // missed scoop hits the counter — SPLAT!
          splats.push({ x: d.x + d.w / 2, w: d.w, lvl: d.lvl, life: 2 });
          popups.push({ x: d.x + d.w / 2, wy: groundY() - 30, text: '💦 Splat!', life: 1 });
          if (splats.length > 12) splats.splice(0, splats.length - 12);
          debris.splice(i, 1);
          continue;
        }
        if (d.life <= 0 || d.wy - camY > H + 120) debris.splice(i, 1);
      }
      for (let i = splats.length - 1; i >= 0; i--) {
        splats[i].life -= dt;
        if (splats[i].life <= 0) splats.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].wy -= 60 * dt;
        popups[i].life -= dt;
        if (popups[i].life <= 0) popups.splice(i, 1);
      }
    }

    // ============ draw ============
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // real round scoops like the thumbnail: ball, white outline, shine, sprinkles
    function drawScoop(x, sy, w, lvl, isTop) {
      const f = flavorFor(lvl);
      const rnd = srand(lvl * 997 + 13);
      const rx = w / 2, ry = rx * 0.92;
      const cx = x + rx;
      const cyy = sy + BLOCK_H - ry;
      // scoop ball
      const g = ctx.createLinearGradient(0, cyy - ry, 0, cyy + ry);
      g.addColorStop(0, f.c);
      g.addColorStop(1, f.d);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(cx, cyy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.stroke();
      // scalloped bottom edge
      ctx.fillStyle = f.c;
      const bumps = Math.max(3, Math.floor(w / 34));
      for (let i = 0; i < bumps; i++) {
        const bx = x + (w * (i + 0.5)) / bumps;
        ctx.beginPath();
        ctx.arc(bx, cyy + ry - 4, 9, 0, Math.PI);
        ctx.fill();
      }
      // shine streak
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.ellipse(x + w * 0.3, cyy - ry * 0.35, Math.max(3, w * 0.06), ry * 0.3, -0.4, 0, Math.PI * 2);
      ctx.fill();
      // sprinkles (kept inside the scoop)
      for (let i = 0; i < 11; i++) {
        const px = x + 10 + rnd() * Math.max(1, w - 20);
        const py = (cyy - ry + 8) + rnd() * (ry * 2 - 16);
        const nx = (px - cx) / rx, ny = (py - cyy) / ry;
        if (nx * nx + ny * ny > 0.72) continue;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(rnd() * Math.PI);
        ctx.fillStyle = SPRINKLE_COLORS[Math.floor(rnd() * SPRINKLE_COLORS.length)];
        ctx.fillRect(-4, -1.5, 8, 3);
        ctx.restore();
      }
      // cherry on the newest scoop (sits on top of the ball)
      if (isTop) {
        const cxp = x + w / 2, cyp = cyy - ry - 8;
        ctx.strokeStyle = '#3fbf7f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cxp, cyp + 4);
        ctx.quadraticCurveTo(cxp + 4, cyp - 6, cxp + 12, cyp - 8);
        ctx.stroke();
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.arc(cxp, cyp + 6, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(cxp - 3, cyp + 3, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function draw(now) {
      const t = now / 1000;
      const toSY = wy => wy - camY;
      const gy = groundY(), gyS = toSY(gy);
      // sky base layer (revealed as the tower climbs out of the shop)
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#5db9f5');
      sky.addColorStop(0.65, '#a8dcff');
      sky.addColorStop(1, '#fff3d6');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);
      // sun, high in the sky (world position — scrolls by gradually)
      {
        const sunS = toSY(gy - 2650);
        if (sunS > -120 && sunS < H + 120) {
          const sunX = W * 0.8, sunR = 30;
          const gl = ctx.createRadialGradient(sunX, sunS, 4, sunX, sunS, 90);
          gl.addColorStop(0, 'rgba(255, 230, 160, 0.9)');
          gl.addColorStop(1, 'rgba(255, 230, 160, 0)');
          ctx.fillStyle = gl;
          ctx.beginPath(); ctx.arc(sunX, sunS, 90, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffedb8';
          ctx.beginPath(); ctx.arc(sunX, sunS, sunR, 0, Math.PI * 2); ctx.fill();
        }
      }
      // drifting clouds up in the sky (world positions)
      {
        const rndc = srand(7);
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        for (let i = 0; i < 6; i++) {
          const wy = gy - 1500 - rndc() * 1900;
          const sy = toSY(wy);
          if (sy < -60 || sy > H + 60) continue;
          const span = W + 260;
          const cxp = ((rndc() * span + t * (8 + i * 2)) % span) - 130;
          const s = 0.7 + (i % 3) * 0.3;
          ctx.beginPath();
          ctx.arc(cxp, sy, 24 * s, 0, Math.PI * 2);
          ctx.arc(cxp + 24 * s, sy + 4 * s, 18 * s, 0, Math.PI * 2);
          ctx.arc(cxp - 24 * s, sy + 5 * s, 16 * s, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // brown board wall climbing into the sky (world band)
      {
        const yTop = gy - 2300, yBot = gy - 1000;
        const sTop = toSY(yTop), sBot = toSY(yBot);
        if (sBot > -60 && sTop < H + 60) {
          ctx.fillStyle = '#8B5E34';
          ctx.fillRect(0, sTop, W, sBot - sTop);
          for (let x = 0; x < W; x += 46) {
            ctx.fillStyle = (x / 46) % 2 === 0 ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.07)';
            ctx.fillRect(x, sTop, 46, sBot - sTop);
            ctx.fillStyle = 'rgba(60,35,15,0.8)';
            ctx.fillRect(x, sTop, 2, sBot - sTop);
          }
          ctx.fillStyle = '#6f4423';
          ctx.fillRect(0, sTop, W, 14);
          ctx.fillRect(0, sBot - 14, W, 14);
          ctx.fillStyle = 'rgba(255,255,255,0.25)';
          for (let x = 23; x < W; x += 92) {
            ctx.beginPath(); ctx.arc(x, sTop + 40, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x, sBot - 40, 3, 0, Math.PI * 2); ctx.fill();
          }
        }
      }
      // ceiling with beams (world band between shop and boards)
      {
        const yTop = gy - 1000, yBot = gy - 880;
        const sTop = toSY(yTop), sBot = toSY(yBot);
        if (sBot > -40 && sTop < H + 40) {
          ctx.fillStyle = '#fff7fb';
          ctx.fillRect(0, sTop, W, sBot - sTop);
          ctx.fillStyle = '#a06a3b';
          for (let x = 10; x < W; x += 90) {
            ctx.fillRect(x, sTop, 26, sBot - sTop);
          }
          ctx.fillStyle = '#e0559a';
          ctx.fillRect(0, sBot - 6, W, 6);
        }
      }
      // shop walls (world band around the counter)
      {
        const yTop = gy - 880, yBot = gy + 400;
        const sTop = toSY(yTop), sBot = toSY(yBot);
        if (sBot > -40 && sTop < H + 40) {
          const wall = ctx.createLinearGradient(0, sTop, 0, sBot);
          wall.addColorStop(0, '#fff7fb');
          wall.addColorStop(1, '#ffd9e8');
          ctx.fillStyle = wall;
          ctx.fillRect(0, sTop, W, sBot - sTop);
          const rnd = srand(42);
          ctx.fillStyle = 'rgba(192, 132, 252, 0.16)';
          for (let i = 0; i < 30; i++) {
            const dx = rnd() * W, dy = rnd() * 880;
            const sy = toSY(gy - dy);
            if (sy < sTop - 20 || sy > sBot + 20) continue;
            ctx.beginPath();
            ctx.arc(dx, sy, 5 + rnd() * 7, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      // striped awning at the top of the shop wall (world position)
      {
        const y0 = toSY(gy - 880);
        const awH = 52;
        if (y0 + awH > -40 && y0 < H + 40) {
          const stripes = Math.ceil(W / 44);
          for (let i = 0; i < stripes; i++) {
            ctx.fillStyle = i % 2 === 0 ? '#ff8ab5' : '#ffffff';
            ctx.fillRect(i * 44, y0, 44, awH);
            ctx.beginPath();
            ctx.arc(i * 44 + 22, y0 + awH, 22, 0, Math.PI);
            ctx.fill();
          }
          ctx.fillStyle = 'rgba(224, 85, 154, 0.9)';
          ctx.fillRect(0, y0 + awH - 4, W, 5);
        }
      }
      // bunting flags below the awning (world position)
      {
        const yBase = toSY(gy - 800);
        if (yBase > -60 && yBase < H + 60) {
          const flagColors = ['#ff8ab5', '#ffd94d', '#9ff0c8', '#7cc4ff', '#c084fc'];
          const sagY = bx => yBase + 26 + Math.sin((bx / W) * Math.PI) * 14;
          ctx.strokeStyle = 'rgba(150, 90, 140, 0.7)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, yBase + 26);
          ctx.quadraticCurveTo(W / 2, yBase + 62, W, yBase + 26);
          ctx.stroke();
          for (let i = 0; i < 9; i++) {
            const fx = W * (0.06 + 0.88 * (i / 8));
            ctx.fillStyle = flagColors[i % flagColors.length];
            ctx.beginPath();
            ctx.moveTo(fx - 9, sagY(fx));
            ctx.lineTo(fx + 9, sagY(fx));
            ctx.lineTo(fx, sagY(fx) + 16);
            ctx.closePath();
            ctx.fill();
          }
        }
      }
      // hanging pendant lamps (world position)
      [0.22, 0.78].forEach((fx, i) => {
        const ly = toSY(gy - 620) + Math.sin(t * 1.2 + i * 2) * 2;
        const lx = W * fx;
        if (ly < -80 || ly > H + 80) return;
        const topAnchor = toSY(gy - 880);
        ctx.strokeStyle = 'rgba(120, 80, 110, 0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(lx, Math.max(topAnchor, ly - 260));
        ctx.lineTo(lx, ly);
        ctx.stroke();
        const lg = ctx.createRadialGradient(lx, ly + 12, 2, lx, ly + 12, 44);
        lg.addColorStop(0, 'rgba(255, 220, 150, 0.85)');
        lg.addColorStop(1, 'rgba(255, 220, 150, 0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.arc(lx, ly + 12, 44, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff9eb5';
        ctx.beginPath();
        ctx.moveTo(lx - 16, ly);
        ctx.lineTo(lx + 16, ly);
        ctx.lineTo(lx + 9, ly + 18);
        ctx.lineTo(lx - 9, ly + 18);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffe9b8';
        ctx.beginPath();
        ctx.arc(lx, ly + 20, 6, 0, Math.PI * 2);
        ctx.fill();
      });
      // shop counter
      ctx.fillStyle = '#f9b8d4';
      ctx.fillRect(0, gyS, W, H - gyS + 60);
      ctx.fillStyle = '#ffffff';
      for (let x = 0; x < W; x += 48) {
        ctx.fillRect(x, gyS, 24, Math.max(0, H - gyS + 60));
      }
      ctx.fillStyle = '#e0559a';
      ctx.fillRect(0, gyS, W, 8);
      // cone: glued to the bottom of the SCREEN (x only, never up/down)
      {
        const cw = baseWidth();
        const cxp = coneX;
        const topY = coneSY() + Math.sin(t * 3) * 3;
        ctx.fillStyle = '#d9a066';
        ctx.beginPath();
        ctx.moveTo(cxp - cw * 0.32, topY);
        ctx.lineTo(cxp + cw * 0.32, topY);
        ctx.lineTo(cxp, topY + 74);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,72,20,0.55)';
        ctx.lineWidth = 3;
        for (let i = 1; i <= 3; i++) {
          const yy = topY + i * 18;
          const half = cw * 0.32 * (1 - (i * 18) / 74);
          ctx.beginPath();
          ctx.moveTo(cxp - half, yy - 8);
          ctx.lineTo(cxp + half, yy + 8);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cxp + half, yy - 8);
          ctx.lineTo(cxp - half, yy + 8);
          ctx.stroke();
        }
      }
      // placed scoops (bottom-up) — the tower NEVER moves itself, only sways
      const leanRatio = Math.max(-1, Math.min(1, lean / maxLean()));
      const sway = leanRatio * 0.09 + Math.sin(t * 4) * 0.012 * Math.abs(leanRatio);
      const pivotX = blocks.length ? blocks[0].x + blocks[0].w / 2 : W / 2;
      const pivotY = toSY(groundY());
      ctx.save();
      ctx.translate(pivotX, pivotY);
      ctx.rotate(sway);
      ctx.translate(-pivotX, -pivotY);
      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        const wy = groundY() - (i + 1) * BLOCK_H;
        const sy = toSY(wy);
        if (sy > H + 80 || sy + BLOCK_H < -160) continue;
        drawScoop(b.x, sy, b.w, b.lvl, i === blocks.length - 1 && !cur && !placing);
      }
      ctx.restore();
      // falling scoop (foreground)
      if (cur && !over) {
        drawScoop(cur.x, toSY(cur.wy), cur.w, cur.lvl, false);
      }
      // caught scoop flying up to the tower
      if (placing && !over) {
        const prev = blocks[blocks.length - 1];
        const prevCX = prev.x + prev.w / 2;
        const off = Math.max(-placing.w * 0.7, Math.min(placing.w * 0.7, placing.touchDX * 0.45));
        const tx = prevCX + off - placing.w / 2;
        const ty = topWorldY() - BLOCK_H;
        const k = Math.min(1, placing.t);
        const e = 1 - Math.pow(1 - k, 2);
        drawScoop(placing.sx + (tx - placing.sx) * e, toSY(placing.sy + (ty - placing.sy) * e), placing.w, placing.lvl, true);
      }
      // falling debris
      debris.forEach(d => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, d.life));
        ctx.translate(d.x + d.w / 2, toSY(d.wy) + BLOCK_H / 2);
        ctx.rotate(d.rot);
        drawScoop(-d.w / 2, -BLOCK_H / 2, d.w, d.lvl, false);
        ctx.restore();
      });
      ctx.globalAlpha = 1;
      // splat marks where missed scoops landed
      splats.forEach(s => {
        const f = flavorFor(s.lvl);
        const ssy = toSY(s.wy);
        ctx.globalAlpha = Math.max(0, Math.min(1, s.life / 2));
        ctx.fillStyle = f.c;
        ctx.beginPath();
        ctx.ellipse(s.x, ssy, s.w * 0.45, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.stroke();
        ctx.fillStyle = f.d;
        ctx.beginPath();
        ctx.arc(s.x - s.w * 0.2, ssy - 2, 4, 0, Math.PI * 2);
        ctx.arc(s.x + s.w * 0.15, ssy + 2, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      // popups
      ctx.textAlign = 'center';
      popups.forEach(p => {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.font = `900 24px 'Segoe UI', Arial, sans-serif`;
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(0,0,0,0.45)';
        ctx.strokeText(p.text, p.x, toSY(p.wy));
        ctx.fillStyle = '#ffd94d';
        ctx.fillText(p.text, p.x, toSY(p.wy));
      });
      ctx.globalAlpha = 1;
      // balance meter (only while stacking)
      if ((running || !over) && blocks.length > 0) {
        const bw = Math.min(200, W * 0.44), bx = W / 2 - bw / 2, by = 112;
        const danger = Math.abs(leanRatio);
        ctx.fillStyle = 'rgba(10, 8, 30, 0.62)';
        roundRect(bx - 8, by - 8, bw + 16, 26, 13);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        roundRect(bx, by, bw, 10, 5);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(W / 2 - 1, by - 3, 2, 16);
        const mx = W / 2 + leanRatio * (bw / 2 - 8);
        ctx.fillStyle = danger > 0.65 ? '#ff5d5d' : (danger > 0.35 ? '#ffd94d' : '#7cf29b');
        ctx.beginPath();
        ctx.arc(mx, by + 5, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.stroke();
      }
    }

    // ============ main loop ============
    function loop(now) {
      if (!running && over) return;
      if (!running) return;
      let dt = (now - lastT) / 1000;
      lastT = now;
      if (dt > 0.05) dt = 0.05;
      update(dt);
      draw(now);
      rafId = requestAnimationFrame(loop);
    }

    // ============ input: drag (or arrow keys) to slide the cone ============
    function canvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * canvas.width / rect.width,
        y: (e.clientY - rect.top) * canvas.height / rect.height
      };
    }
    // screen pixels match world pixels — drag slides the cone 1:1
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      ensureAudio();
      if (!running || over) return;
      dragging = true;
      lastPX = canvasPos(e).x;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!running || over || !dragging) return;
      const sx = canvasPos(e).x;
      coneX += (sx - lastPX);
      lastPX = sx;
      clampCone();
    });
    const stopDrag = () => { dragging = false; };
    canvas.addEventListener('pointerup', stopDrag);
    canvas.addEventListener('pointercancel', stopDrag);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; e.preventDefault(); }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; e.preventDefault(); }
      if (e.code === 'Space') {
        e.preventDefault();
        ensureAudio();
        if (!running && !over && startScreen.style.display !== 'none') startGame();
      }
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });

    // ============ boot ============
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.classList.toggle('off', muted);
    updateHUD();
    // idle backdrop behind the start panel
    startGameBackdrop();
    function startGameBackdrop() {
      resizeCanvas();
      const w = baseWidth();
      blocks = [{ x: W / 2 - w / 2, w, lvl: 0 }];
      coneX = W / 2;
      camY = topWorldY() - H * 0.42;
      draw(performance.now());
    }
    window.addEventListener('pagehide', () => cancelAnimationFrame(rafId));
  </script>
</body>
</html>
