<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Time Test</title>
  <link rel="stylesheet" href="./pixll-shell.css">
  <style>
    body {
      background: #f0f4ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 30px;
      text-align: center;
    }
    .reaction-box {
      width: 320px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      border-radius: 16px;
      margin: 30px auto;
      background: #dbeafe;
      cursor: pointer;
      transition: background 0.2s;
    }
    .reaction-box.ready {
      background: #4ade80;
      color: #fff;
    }
    .reaction-box.too-soon {
      background: #f87171;
      color: #fff;
    }
    .stats-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .stat {
      background: #eef2ff;
      border-radius: 12px;
      padding: 8px 18px;
      font-size: 0.95rem;
      color: #4338ca;
      font-weight: bold;
    }
    .stat div {
      font-size: 1.3rem;
      color: #111;
    }
    #muteBtn {
      background: #e5e7eb;
      color: #111;
      padding: 12px 20px;
    }
    button {
      padding: 12px 32px;
      font-size: 1.2rem;
      border-radius: 8px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
      transition: background 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <nav class="pixll-topbar"><a href="../index.html" class="pixll-back">← Pixll Arcade</a><span class="pixll-badge">✨ Pixll • ⚡ Reaction Time</span></nav>
  <header class="pixll-hero">
    <div class="pixll-hero-emoji">⚡</div>
    <h2 class="pixll-hero-title">Reaction Time Test</h2>
    <p class="pixll-hero-tag">Hit Start, wait for green… then click as fast as you can! Too soon = foul.</p>
    <div class="pixll-how"><span class="pixll-chip">🖱️ Wait for green</span><span class="pixll-chip">⚡ Click fast</span><span class="pixll-chip">🏆 Under 250ms is elite</span></div>
  </header>
  <div class="container">
    <h1>⚡ Reaction Time Test</h1>
    <div class="stats-row">
      <div class="stat">🏆 Best<div id="bestTime">—</div></div>
      <div class="stat">📊 Avg (5)<div id="avgTime">—</div></div>
      <div class="stat">🎯 Tries<div id="tries">0</div></div>
    </div>
    <div id="reactionBox" class="reaction-box">Click Start to Begin</div>
    <button id="startBtn">Start</button>
    <button id="muteBtn" title="Sound on/off">🔊</button>
    <div id="result" style="font-size:1.3rem;margin-top:18px;"></div>
  </div>
  <script>
    const reactionBox = document.getElementById('reactionBox');
    const startBtn = document.getElementById('startBtn');
    const result = document.getElementById('result');
    const bestEl = document.getElementById('bestTime');
    const avgEl = document.getElementById('avgTime');
    const triesEl = document.getElementById('tries');
    const muteBtn = document.getElementById('muteBtn');
    let waiting = false, startTime, timeoutId;
    let best = Infinity, tries = 0;
    const recent = [];
    try {
      best = parseInt(localStorage.getItem('rt_best')) || Infinity;
      tries = parseInt(localStorage.getItem('rt_tries')) || 0;
    } catch (e) {}

    // ---- tiny synth sounds ----
    let rtAudio = null, rtMuted = false;
    try { rtMuted = localStorage.getItem('rt_muted') === '1'; } catch (e) {}
    function rtTone(freq, dur, type, vol, delay) {
      if (rtMuted) return;
      try {
        if (!rtAudio) rtAudio = new (window.AudioContext || window.webkitAudioContext)();
        const t = rtAudio.currentTime + (delay || 0);
        const osc = rtAudio.createOscillator();
        const gain = rtAudio.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(vol || 0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(rtAudio.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
      } catch (e) {}
    }
    function rank(ms) {
      if (ms < 200) return '⚡ Lightning! Elite athlete zone!';
      if (ms < 250) return '🚀 Superhuman speed!';
      if (ms < 300) return '🔥 Great! Above average!';
      if (ms < 400) return '👍 Solid! Keep practicing!';
      return '🐢 Slow and steady — try again!';
    }
    function renderStats() {
      bestEl.textContent = best === Infinity ? '—' : best + ' ms';
      avgEl.textContent = recent.length
        ? Math.round(recent.reduce((a, b) => a + b, 0) / recent.length) + ' ms' : '—';
      triesEl.textContent = tries;
      try {
        localStorage.setItem('rt_best', best === Infinity ? '' : String(best));
        localStorage.setItem('rt_tries', String(tries));
      } catch (e) {}
    }
    muteBtn.textContent = rtMuted ? '🔇' : '🔊';
    muteBtn.onclick = () => {
      rtMuted = !rtMuted;
      try { localStorage.setItem('rt_muted', rtMuted ? '1' : '0'); } catch (e) {}
      muteBtn.textContent = rtMuted ? '🔇' : '🔊';
    };

    function reset() {
      reactionBox.textContent = 'Wait for green...';
      reactionBox.className = 'reaction-box';
      result.textContent = '';
      waiting = true;
      timeoutId = setTimeout(() => {
        reactionBox.textContent = 'Click!';
        reactionBox.className = 'reaction-box ready';
        startTime = Date.now();
        waiting = false;
        rtTone(880, 0.12, 'sine', 0.12);
      }, 1200 + Math.random() * 2000);
    }

    startBtn.onclick = () => {
      startBtn.disabled = true;
      reset();
    };

    reactionBox.onclick = () => {
      if (reactionBox.classList.contains('ready')) {
        const reaction = Date.now() - startTime;
        tries++;
        recent.push(reaction);
        if (recent.length > 5) recent.shift();
        let newBest = false;
        if (reaction < best) { best = reaction; newBest = true; }
        renderStats();
        rtTone(660, 0.1, 'triangle', 0.12);
        reactionBox.textContent = `Your time: ${reaction} ms`;
        result.textContent = (newBest ? '🏆 New best! ' : '') + rank(reaction) + ' Click Start to try again!';
        reactionBox.className = 'reaction-box';
        startBtn.disabled = false;
      } else if (waiting) {
        clearTimeout(timeoutId);
        rtTone(160, 0.2, 'sawtooth', 0.08);
        reactionBox.textContent = 'Too soon!';
        reactionBox.className = 'reaction-box too-soon';
        result.textContent = 'Wait for green first! Click Start to try again!';
        startBtn.disabled = false;
        waiting = false;
      }
    };
    renderStats();
  </script>
</body>
</html>
