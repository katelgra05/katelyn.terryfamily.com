<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./pixll-shell.css">
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            background-image: url('./wood background.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            padding: 70px 12px 26px 12px;
            box-sizing: border-box;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .game-container {
            margin: 0;
            background-color: white; /* White background behind the game */
            padding: clamp(20px, 4vmin, 40px); /* Add padding for spacing */
            border-radius: 16px; /* Rounded corners for aesthetics */
            box-shadow: 0 0 10px rgba(0,0,0,0.1); /* Subtle shadow for depth */
            display: inline-block; /* Center the container */
            width: min(96vw, 760px);
            box-sizing: border-box;
        }
        .game-container h1 {
            font-size: clamp(24px, 4.6vmin, 38px);
        }
        button:not(.back-button) {
            font-size: clamp(22px, 4.4vmin, 34px);
            margin: min(2vmin, 16px);
            padding: clamp(18px, 4vmin, 34px) clamp(20px, 5vmin, 40px);
            min-width: min(38vw, 190px);
            cursor: pointer;
            background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
            color: black;
            border: none;
            border-radius: 16px;
            font-weight: normal;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            transition: background 0.2s, transform 0.2s;
        }
        button:not(.back-button):hover {
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            transform: scale(1.05);
        }
        #rock { background: none; }
        #paper { background: none; }
        #scissors { background: none; }
        #retry { background: none; }
        #battle {
            font-size: clamp(52px, 12vmin, 84px);
            margin: 10px;
            min-height: 1.2em;
        }
        #streakLine {
            font-size: 20px;
            font-weight: bold;
            color: #7c3aed;
        }
        #muteBtn {
            font-size: 20px !important;
            min-width: 0 !important;
            padding: 12px 18px !important;
        }
        #result {
            font-size: 24px;
            margin: 20px;
        }
        #score {
            font-size: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <nav class="pixll-topbar"><a href="../index.html" class="pixll-back">← Pixll Arcade</a><span class="pixll-badge">✨ Pixll • ✂️ RPS</span></nav>
    <header class="pixll-hero">
      <div class="pixll-hero-emoji">✂️</div>
      <h2 class="pixll-hero-title">Rock Paper Scissors</h2>
      <p class="pixll-hero-tag">Rock crushes scissors, scissors cuts paper, paper covers rock. Best of luck!</p>
      <div class="pixll-how"><span class="pixll-chip">🪨 Rock</span><span class="pixll-chip">📄 Paper</span><span class="pixll-chip">✂️ Scissors</span></div>
    </header>
    <div class="game-container">
        <h1>🪨📄✂️ Rock Paper Scissors 🪨📄✂️</h1>
        <p id="streakLine">🔥 Streak: 0 &nbsp;•&nbsp; 🏆 Best: 0</p>

        <div>
            <button id="rock" onclick="play('rock')">🪨 Rock</button>
            <button id="paper" onclick="play('paper')">📄 Paper</button>
            <button id="scissors" onclick="play('scissors')">✂️ Scissors</button>
        </div>

        <div id="battle"></div>
        <div id="result">Choose your move!</div>
        <div id="score">Wins: 0 | Losses: 0 | Ties: 0</div>
        <button id="retry" style="display: none;" onclick="retryGame()">Retry</button> <!-- Retry button -->
        <button id="muteBtn" onclick="toggleMute()" title="Sound on/off">🔊</button>
    </div>

    <script>
        let wins = 0, losses = 0, ties = 0, streak = 0, best = 0;
        let rpsMuted = false;
        try {
            wins = parseInt(localStorage.getItem('rps_w')) || 0;
            losses = parseInt(localStorage.getItem('rps_l')) || 0;
            ties = parseInt(localStorage.getItem('rps_t')) || 0;
            best = parseInt(localStorage.getItem('rps_best')) || 0;
            rpsMuted = localStorage.getItem('rps_muted') === '1';
        } catch (e) {}
        const MOVE_EMOJI = { rock: '🪨', paper: '📄', scissors: '✂️' };

        // ---- tiny synth sounds ----
        let rpsAudio = null;
        function rpsTone(freq, dur, type, vol, delay) {
            if (rpsMuted) return;
            try {
                if (!rpsAudio) rpsAudio = new (window.AudioContext || window.webkitAudioContext)();
                const t = rpsAudio.currentTime + (delay || 0);
                const osc = rpsAudio.createOscillator();
                const gain = rpsAudio.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol || 0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                osc.connect(gain);
                gain.connect(rpsAudio.destination);
                osc.start(t);
                osc.stop(t + dur + 0.02);
            } catch (e) {}
        }
        function toggleMute() {
            rpsMuted = !rpsMuted;
            try { localStorage.setItem('rps_muted', rpsMuted ? '1' : '0'); } catch (e) {}
            document.getElementById('muteBtn').textContent = rpsMuted ? '🔇' : '🔊';
        }
        function saveAll() {
            try {
                localStorage.setItem('rps_w', String(wins));
                localStorage.setItem('rps_l', String(losses));
                localStorage.setItem('rps_t', String(ties));
                localStorage.setItem('rps_best', String(best));
            } catch (e) {}
        }
        function renderAll() {
            document.getElementById('score').innerHTML =
                `Wins: ${wins} | Losses: ${losses} | Ties: ${ties}`;
            document.getElementById('streakLine').innerHTML =
                `🔥 Streak: ${streak} &nbsp;•&nbsp; 🏆 Best: ${best}`;
        }

        function play(playerChoice) {
            // Computer makes random choice
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * 3)];

            // Figure out who wins
            let result;
            if (playerChoice === computerChoice) {
                result = "It's a tie! 🤝";
                ties++;
                rpsTone(400, 0.12, 'triangle', 0.09);
            } else if (
                (playerChoice === 'rock' && computerChoice === 'scissors') ||
                (playerChoice === 'paper' && computerChoice === 'rock') ||
                (playerChoice === 'scissors' && computerChoice === 'paper')
            ) {
                result = streak >= 2 ? `You win! 🎉🔥 x${streak + 1} streak!` : 'You win! 🎉';
                wins++;
                streak++;
                if (streak > best) best = streak;
                rpsTone(523, 0.1, 'triangle', 0.11);
                rpsTone(784, 0.16, 'triangle', 0.11, 0.08);
            } else {
                result = 'Computer wins! 💻';
                losses++;
                streak = 0;
                rpsTone(220, 0.18, 'sawtooth', 0.07);
            }

            // Show results
            document.getElementById('battle').textContent =
                `${MOVE_EMOJI[playerChoice]}  ⚔️  ${MOVE_EMOJI[computerChoice]}`;
            document.getElementById('result').innerHTML = result;
            renderAll();
            saveAll();

            // Show Retry button
            document.getElementById('retry').style.display = 'inline';
        }

        function retryGame() {
            document.getElementById('result').innerHTML = 'Choose your move!';
            document.getElementById('battle').textContent = '';
            document.getElementById('retry').style.display = 'none';
        }

        document.getElementById('muteBtn').textContent = rpsMuted ? '🔇' : '🔊';
        renderAll();
    </script>
</body>
</html>
