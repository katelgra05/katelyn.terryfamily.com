<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🗺️ Open World • Pixll</title>
  <link rel="icon" type="image/png" href="../pixll-logo.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    .pixll-topbar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5000;
      pointer-events: none;
      font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    }
    .pixll-topbar > * { pointer-events: auto; }
    .pixll-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px 8px 10px;
      border-radius: 999px;
      background: rgba(10, 8, 30, 0.72);
      color: #fff !important;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.18s ease;
    }
    .pixll-back:hover { transform: scale(1.05); }
    .pixll-back img {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }
    .pixll-badge {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .game-container {
      position: relative;
      margin: 0;
      width: 100vw;
      flex: 1;
      min-height: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: pointer;
    }
    .hud {
      position: absolute;
      top: 60px;
      left: 14px;
      z-index: 5;
      background: rgba(13, 19, 27, 0.93);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.5;
      pointer-events: none;
    }
    .hud .title { font-weight: bold; color: #ffd700; font-size: 1rem; }
    #hiddenBadge {
      display: none;
      position: absolute;
      top: 196px;
      left: 14px;
      z-index: 5;
      background: rgba(13, 19, 27, 0.93);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      pointer-events: none;
    }
    #hintBar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background: rgba(13, 19, 27, 0.93);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <nav class="pixll-topbar"><a href="../index.html" class="pixll-back"><img src="../pixll-logo.png" alt="Pixll logo">← Pixll Arcade</a><span class="pixll-badge">✨ Pixll • 🗺️ Open World</span></nav>
  <div class="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="title">🌍 Open World</div>
      <div id="coords">x: 0, y: 0</div>
      <div>🫐 Berries: <span id="berries">0</span></div>
      <div>🍄 Mushrooms: <span id="shrooms">0</span></div>
    </div>
    <div id="hiddenBadge">🤫 Hidden!</div>
    <div id="hintBar">WASD / Arrows to walk &nbsp;•&nbsp; Shift to run &nbsp;•&nbsp; Touch: drag to walk &nbsp;•&nbsp; 🍄 touch stumps &nbsp;•&nbsp; 🐚🦔🐗🐾 + meerkats!</div>
  </div>

  <script>
    // ============ Open World: an original top-down island ramble ============
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const berriesEl = document.getElementById('berries');
    const shroomsEl = document.getElementById('shrooms');
    const coordsEl = document.getElementById('coords');
    const hiddenBadge = document.getElementById('hiddenBadge');

    let W = 0, H = 0;
    function resizeCanvas() {
      W = canvas.width = window.innerWidth || 800;
      H = canvas.height = window.innerHeight || 600;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ============ state ============
    let running = true, rafId = null, lastT = 0;

    const TILE = 32, WT = 240, HT = 240; // one big island, ocean at the edges
    const ZOOM = 1.6;                    // zoomed-in camera
    const OCEAN = 0, WATER = 1, SAND = 2, GRASS = 3, MUD = 4;
    const FIXED_SEED = 20260906;
    let seed = FIXED_SEED;
    let tiles = new Uint8Array(WT * HT);
    let bigLake = new Uint8Array(WT * HT);
    let snow = new Uint8Array(WT * HT);
    let ice = new Uint8Array(WT * HT);
    let damp = new Uint8Array(WT * HT); // dark wet floor hugging ponds + lake
    let savannah = new Uint8Array(WT * HT); // yellow savannah ground, bottom-left (mud, not water)
    let forest = new Uint8Array(WT * HT); // dense forest floor mask (tree clusters)
    let trees = [];      // {x, y, r, hue, sway, pine}
    let trunkSet = new Set();
    let palms = [];      // {x, y, sway}
    let palmSet = new Set();
    let stumps = [];     // {x, y, r, mush: [{dx, dy, empty, timer}]}
    let stumpSet = new Set();
    let bushes = [];     // small berry bushes {x, y, r, berries, regrow, seed}
    let bigBushes = [];  // hiding spots {x, y, rx, ry, seed}
    let fishes = [];     // {x, y, heading, speed, turn, sea}
    let pondSpots = [], oceanSpots = [];
    let ducks = [];      // {x, y, heading, speed, timer, paused, sc, body, head, wakeT, age, fade, ...nesting}
    let crabHoles = [];  // {x, y, state, timer, cx, cy, heading, dartT, pauseT, carrying, stash}
    let shells = [];     // beach shells crabs haul home: {x, y, state, carrier, hx, hy, tint}
    let shellRespT = 0;
    let sprigSources = []; // nest sprigs: {x, y, kind, stock, max, timer} kind = cattail|grass|stick
    let nests = [];        // {x, y, sprigs, need, eggs: [{age}], clutch, laid, mom}
    let chicks = [];       // {x, y, heading, speed, mom, sc, findT}
    let poos = [];         // duck business: {x, y, age}, melts away after 30s
    let burrows = [];      // bunny dens: {x, y, snowy}
    let bunnies = [];      // {x, y, bx, by, heading, state, timer, hop, moving, col, sc, baby, snowy}
    let hedgehogs = [];    // forest friends: {x, y, hx, hy, heading, state, timer, moving, hop, col, ...}
    let warthogs = [];     // savannah warthogs: {x, y, heading, state, timer, resting, sc, ...}
    let snowyOwls = [];    // snowy owls roaming the snowfields: {x, y, heading, state, perch, ...}
    let pineSpots = [];    // pine trees owls can perch on
    let meerkats = [];     // savannah meerkat mob: {x, y, hx, hy, heading, state, timer, ...}
    let snakes = [];       // (removed — kept so old saves/refs never crash)
    let snakeHoles = [];   // (removed — kept so old saves/refs never crash)
    let bees = [];         // bees visiting flowers: {x, y, heading, state, timer, flower, ...}
    let meerkatHoles = []; // meerkat bolt-holes to dive into {x, y}
    let meerkatHome = null;
    let hogSpots = [];     // savannah grass tiles warthogs can spawn on
    let lilypads = [];     // floating pads on lake + ocean: {x, y, r, flower, phase}
    let pondRegions = [];  // connected open-water areas (fish + ducks each)
    let regionOf = new Int32Array(0);
    let decor = [];      // {x, y, kind, s} tufts / flowers / pebbles / leaves / shells
    let particles = [];
    let mmCanvas = null; // pre-rendered minimap terrain
    const player = { x: 0, y: 0, r: 9, fx: 0, fy: 1, moving: false, running: false, step: 0, vx: 0, vy: 0 };
    let berries = 0, shroomCount = 0, hidden = false, rippleT = 0, eatCd = 0, shroomCd = 0, duckUpT = 0, fishUpT = 0, stuckT = 0;
    let pondUpT = 0, bunnyUpT = 0, hedgeUpT = 0, hogUpT = 0, owlUpT = 0, meerkatUpT = 0, snakeUpT = 0, crabUpT = 0, beeUpT = 0;
    const keys = {};
    const touch = { active: false, id: null, sx: 0, sy: 0, dx: 0, dy: 0 };
    const WALK = 220, RUN = 340;

    const tidx = (tx, ty) => ty * WT + tx;
    const inTiles = (tx, ty) => tx >= 0 && ty >= 0 && tx < WT && ty < HT;

    // ============ seeded random + value noise ============
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function makeNoise(rand) {
      const perm = Array.from({ length: 256 }, (_, i) => i);
      for (let i = 255; i > 0; i--) {
        const j = (rand() * (i + 1)) | 0;
        const tmp = perm[i]; perm[i] = perm[j]; perm[j] = tmp;
      }
      const p = new Uint8Array(512);
      for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
      const lat = new Float32Array(256);
      for (let i = 0; i < 256; i++) lat[i] = rand();
      const fade = t => t * t * (3 - 2 * t);
      return function (x, y) {
        const xi = Math.floor(x), yi = Math.floor(y);
        const xf = x - xi, yf = y - yi;
        const X = xi & 255, Y = yi & 255;
        const v00 = lat[p[(p[X] + Y) & 511] & 255];
        const v10 = lat[p[(p[(X + 1) & 255] + Y) & 511] & 255];
        const v01 = lat[p[(p[X] + Y + 1) & 511] & 255];
        const v11 = lat[p[(p[(X + 1) & 255] + Y + 1) & 511] & 255];
        const u = fade(xf), v = fade(yf);
        return (v00 * (1 - u) + v10 * u) * (1 - v) + (v01 * (1 - u) + v11 * u) * v;
      };
    }
    function fbm(n2, x, y) {
      let v = 0, amp = 0.5, f = 1, norm = 0;
      for (let o = 0; o < 4; o++) {
        v += amp * n2(x * f, y * f);
        norm += amp;
        amp *= 0.5; f *= 2.03;
      }
      return v / norm;
    }
    const thash = (x, y) => {
      let h = (x * 374761393 + y * 668265263 + seed * 974634211) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    };

    // ============ world generation: one island, ocean edges, ponds + big lake ============
    function genWorld(s) {
      seed = s;
      const rand = mulberry32(s);
      const nE = makeNoise(mulberry32((s ^ 0x9e37) | 0));
      const nM = makeNoise(mulberry32((s ^ 0x51f3) | 0));
      tiles = new Uint8Array(WT * HT);
      bigLake = new Uint8Array(WT * HT);
      snow = new Uint8Array(WT * HT);
      ice = new Uint8Array(WT * HT);
      damp = new Uint8Array(WT * HT);
      forest = new Uint8Array(WT * HT);
      savannah = new Uint8Array(WT * HT);
      // elevation with island falloff so the ocean hugs the map edges
      for (let ty = 0; ty < HT; ty++) {
        for (let tx = 0; tx < WT; tx++) {
          let e = fbm(nE, tx * 0.014, ty * 0.014) + 0.15 * fbm(nE, tx * 0.06 + 40, ty * 0.06 + 40);
          const dx = (tx - WT / 2) / (WT / 2), dy = (ty - HT / 2) / (HT / 2);
          const d = Math.sqrt(dx * dx + dy * dy) / Math.SQRT2;
          e += 0.06 - Math.pow(d, 2.1) * 0.72;
          tiles[tidx(tx, ty)] = e < 0.30 ? OCEAN : GRASS;
        }
      }
      // ocean = wet touching the border; inland wet stays lakes
      {
        const stack = [];
        for (let x = 0; x < WT; x++) { stack.push([x, 0]); stack.push([x, HT - 1]); }
        for (let y = 0; y < HT; y++) { stack.push([0, y]); stack.push([WT - 1, y]); }
        const seenO = new Uint8Array(WT * HT);
        while (stack.length) {
          const c = stack.pop();
          if (!inTiles(c[0], c[1])) continue;
          const i = tidx(c[0], c[1]);
          if (seenO[i] || tiles[i] !== OCEAN) continue;
          seenO[i] = 1;
          stack.push([c[0] + 1, c[1]], [c[0] - 1, c[1]], [c[0], c[1] + 1], [c[0], c[1] - 1]);
        }
        for (let i = 0; i < WT * HT; i++) if (tiles[i] === OCEAN && !seenO[i]) tiles[i] = WATER;
      }
      // sink small side-islands: keep only the biggest landmass
      {
        const comp = new Int32Array(WT * HT).fill(-1);
        const sizes = [];
        let n = 0;
        for (let y = 0; y < HT; y++) {
          for (let x = 0; x < WT; x++) {
            const si = tidx(x, y);
            if (tiles[si] === OCEAN || tiles[si] === WATER || comp[si] !== -1) continue;
            const q = [si];
            comp[si] = n;
            let sz = 0;
            while (q.length) {
              const c = q.pop();
              sz++;
              const cx = c % WT, cy = (c / WT) | 0;
              const nb = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
              for (const nn of nb) {
                if (!inTiles(nn[0], nn[1])) continue;
                const ni = tidx(nn[0], nn[1]);
                if (tiles[ni] === OCEAN || tiles[ni] === WATER || comp[ni] !== -1) continue;
                comp[ni] = n;
                q.push(ni);
              }
            }
            sizes.push(sz);
            n++;
          }
        }
        if (n > 1) {
          let main = 0;
          for (let i = 1; i < n; i++) if (sizes[i] > sizes[main]) main = i;
          for (let i = 0; i < WT * HT; i++) {
            if (comp[i] === -1 || comp[i] === main) continue;
            const bx = i % WT, by = (i / WT) | 0;
            const sea =
              (bx + 1 < WT && tiles[i + 1] === OCEAN) || (bx - 1 >= 0 && tiles[i - 1] === OCEAN) ||
              (by + 1 < HT && tiles[i + WT] === OCEAN) || (by - 1 >= 0 && tiles[i - WT] === OCEAN);
            tiles[i] = sea ? OCEAN : WATER;
          }
        }
      }
      // scattered inland ponds (grass runs straight to their water)
      let pondsWanted = 24, tries = 0;
      while (pondsWanted > 0 && tries < 800) {
        tries++;
        const px = 25 + ((rand() * (WT - 50)) | 0), py = 25 + ((rand() * (HT - 50)) | 0);
        if (tiles[tidx(px, py)] !== GRASS) continue;
        const dcx = px - (WT >> 1), dcy = py - (HT >> 1);
        if (dcx * dcx + dcy * dcy < 100) continue;
        let clear = true;
        for (let yy = py - 10; yy <= py + 10 && clear; yy++) {
          for (let xx = px - 10; xx <= px + 10; xx++) {
            if (!inTiles(xx, yy)) continue;
            if (tiles[tidx(xx, yy)] === OCEAN) { clear = false; break; }
          }
        }
        if (!clear) continue;
        const pr = 2 + rand() * 2.5;
        for (let yy = Math.floor(py - pr - 1); yy <= Math.ceil(py + pr + 1); yy++) {
          for (let xx = Math.floor(px - pr - 1); xx <= Math.ceil(px + pr + 1); xx++) {
            if (!inTiles(xx, yy) || tiles[tidx(xx, yy)] !== GRASS) continue;
            const ddx = xx - px, ddy = yy - py;
            if (Math.sqrt(ddx * ddx + ddy * ddy) < pr + (thash(xx, yy) - 0.5) * 1.6) tiles[tidx(xx, yy)] = WATER;
          }
        }
        pondsWanted--;
      }
      // one big lake, low and to the south-east
      {
        const blx = WT * 0.54, bly = HT * 0.83, blr = 13;
        for (let yy = Math.floor(bly - blr - 2); yy <= Math.ceil(bly + blr + 2); yy++) {
          for (let xx = Math.floor(blx - blr - 2); xx <= Math.ceil(blx + blr + 2); xx++) {
            if (!inTiles(xx, yy) || tiles[tidx(xx, yy)] === OCEAN) continue;
            const dx = (xx - blx) * 0.8, dy = (yy - bly) * 1.15;
            if (Math.sqrt(dx * dx + dy * dy) < blr * (0.65 + 0.7 * fbm(nE, xx * 0.07 + 900, yy * 0.07 + 900))) {
              tiles[tidx(xx, yy)] = WATER;
              bigLake[tidx(xx, yy)] = 1;
            }
          }
        }
      }
      // fill tiny odd ponds + lone wet tiles back to grass
      {
        const seen = new Uint8Array(WT * HT);
        for (let y = 0; y < HT; y++) {
          for (let x = 0; x < WT; x++) {
            const li = tidx(x, y);
            if (tiles[li] !== WATER || seen[li]) continue;
            const region = [];
            const q = [[x, y]];
            seen[li] = 1;
            while (q.length) {
              const c = q.pop();
              region.push(c);
              const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
              for (const dd of dirs) {
                const nx = c[0] + dd[0], ny = c[1] + dd[1];
                if (!inTiles(nx, ny)) continue;
                const ni = tidx(nx, ny);
                if (tiles[ni] !== WATER || seen[ni]) continue;
                seen[ni] = 1;
                q.push([nx, ny]);
              }
            }
            if (region.length < 25) {
              for (const c of region) { tiles[tidx(c[0], c[1])] = GRASS; bigLake[tidx(c[0], c[1])] = 0; }
            }
          }
        }
      }
      // sand hugs the ocean (ponds stay grassy), patchy bits by the big lake
      for (let y = 0; y < HT; y++) {
        for (let x = 0; x < WT; x++) {
          const i = tidx(x, y);
          if (tiles[i] !== GRASS) continue;
          let nearOcean = false;
          for (let oy = -2; oy <= 2 && !nearOcean; oy++) {
            for (let ox = -2; ox <= 2; ox++) {
              if (!ox && !oy) continue;
              if (!inTiles(x + ox, y + oy)) continue;
              if (tiles[tidx(x + ox, y + oy)] === OCEAN) { nearOcean = true; break; }
            }
          }
          if (nearOcean) { tiles[i] = SAND; continue; }
          let nearBig = false;
          for (let oy = -1; oy <= 1 && !nearBig; oy++) {
            for (let ox = -1; ox <= 1; ox++) {
              if (!ox && !oy) continue;
              if (!inTiles(x + ox, y + oy)) continue;
              if (bigLake[tidx(x + ox, y + oy)]) { nearBig = true; break; }
            }
          }
          if (nearBig && thash(x, y) < 0.35) tiles[i] = SAND;
        }
      }
      // a few tiny sandy islets out in the ocean (palm homes)
      const islets = [];
      tries = 0;
      while (islets.length < 8 && tries < 900) {
        tries++;
        const cx = 20 + ((rand() * (WT - 40)) | 0), cy = 20 + ((rand() * (HT - 40)) | 0);
        const r = 3 + rand() * 3;
        let ok = tiles[tidx(cx, cy)] === OCEAN;
        for (let yy = Math.floor(cy - r - 3); yy <= Math.ceil(cy + r + 3) && ok; yy++) {
          for (let xx = Math.floor(cx - r - 3); xx <= Math.ceil(cx + r + 3); xx++) {
            if (!inTiles(xx, yy)) { ok = false; break; }
            const ddx = xx - cx, ddy = yy - cy;
            if (Math.sqrt(ddx * ddx + ddy * ddy) <= r + 3 && tiles[tidx(xx, yy)] !== OCEAN) { ok = false; break; }
          }
        }
        if (!ok) continue;
        for (const o of islets) {
          const odx = cx - o.x, ody = cy - o.y;
          if (Math.sqrt(odx * odx + ody * ody) < r + o.r + 8) { ok = false; break; }
        }
        if (!ok) continue;
        for (let yy = Math.floor(cy - r - 1); yy <= Math.ceil(cy + r + 1); yy++) {
          for (let xx = Math.floor(cx - r - 1); xx <= Math.ceil(cx + r + 1); xx++) {
            if (!inTiles(xx, yy)) continue;
            const ddx = xx - cx, ddy = yy - cy;
            if (Math.sqrt(ddx * ddx + ddy * ddy) < r + (thash(xx, yy) - 0.5) * 1.4) tiles[tidx(xx, yy)] = SAND;
          }
        }
        islets.push({ x: cx, y: cy, r });
      }
      // savannah bottom-left: yellow ground, pond water turns to mud; animals may wander in
      {
        const dx0 = 45, dy0 = 200, drx = 62, dry = 54;
        for (let yy = 0; yy < HT; yy++) {
          for (let xx = 0; xx < WT; xx++) {
            const ex = (xx - dx0) / drx, ey = (yy - dy0) / dry;
            if (ex * ex + ey * ey > 0.85 + 0.3 * thash(xx, yy)) continue;
            const di = tidx(xx, yy);
            if (tiles[di] === GRASS) savannah[di] = 1;
            else if (tiles[di] === WATER) { tiles[di] = MUD; savannah[di] = 1; bigLake[di] = 0; }
          }
        }
        // a few guaranteed mud ponds scooped out of the savannah floor
        let mudWanted = 3, mudTries = 0;
        while (mudWanted > 0 && mudTries < 400) {
          mudTries++;
          const px = dx0 + ((rand() - 0.5) * drx * 1.2), py = dy0 + ((rand() - 0.5) * dry * 1.2);
          const ptx = Math.round(px), pty = Math.round(py);
          if (!inTiles(ptx, pty) || tiles[tidx(ptx, pty)] !== GRASS || !savannah[tidx(ptx, pty)]) continue;
          const pr = 2 + rand() * 1.5;
          for (let yy = Math.floor(pty - pr - 1); yy <= Math.ceil(pty + pr + 1); yy++) {
            for (let xx = Math.floor(ptx - pr - 1); xx <= Math.ceil(ptx + pr + 1); xx++) {
              if (!inTiles(xx, yy) || tiles[tidx(xx, yy)] !== GRASS || !savannah[tidx(xx, yy)]) continue;
              const ddx = xx - px, ddy = yy - py;
              if (Math.sqrt(ddx * ddx + ddy * ddy) < pr + (thash(xx, yy) - 0.5) * 1.4) {
                tiles[tidx(xx, yy)] = MUD;
              }
            }
          }
          mudWanted--;
        }
      }
      // snowy top-left corner: grass up there turns to snow, ponds freeze to ice

      // bunnies hop dry land only — no swimming rabbits!
    function bunnyGround(x, y) {

            const hhy = sn.y + Math.sin(sn.heading) * hstep;
            if (!snakeBlocked(sn.x, hhy)) sn.y = hhy;
            if (sn.timer <= 0) { sn.state = 'slither'; sn.timer = 1 + Math.random() * 2; }
          }
        } else { // sleep: curled up in a coil
          sn.timer -= dt;
          if (sn.timer <= 0) { sn.state = 'slither'; sn.timer = 1 + Math.random() * 2; }
        }
      }
      // the den holds 3 snakes (replacements slide out of a burrow)
      snakeUpT -= dt;
      if (snakeUpT <= 0) {
        snakeUpT = 10;
        if (snakes.length < 3 && snakeHoles.length) {
          const sh = snakeHoles[(Math.random() * snakeHoles.length) | 0];
          spawnSnake(sh.x, sh.y);
        }
      }
      // snowy owls live 3 minutes, then fade and are replaced
      for (let oi = snowyOwls.length - 1; oi >= 0; oi--) {
        const ow = snowyOwls[oi];
        ow.age = (ow.age || 0) + dt;
        if (ow.fade === undefined) ow.fade = 1;
        if (ow.age > 180) {
          ow.fade -= dt / 4;
          if (ow.fade <= 0) {
            // let go of any bunny on the way out
            if (ow.prey && bunnies.includes(ow.prey)) {
              ow.prey.state = 'out'; ow.prey.sc = ow.preySc || ow.prey.sc; ow.prey.timer = 1;
            }
            snowyOwls.splice(oi, 1);
            continue;
          }
        }
        if (ow.state === 'perch') {
          ow.flap += dt * 1.5;
          ow.timer -= dt;
          if (ow.timer <= 0) { ow.state = 'fly'; ow.perch = null; ow.timer = 0; }
          continue;
        }
        if (ow.state === 'eat') {
          ow.flap += dt * 1.5;
          ow.gulpT -= dt;
          const oep = ow.prey;
          if (oep && bunnies.includes(oep)) {
            const oprog = Math.max(0, Math.min(1, 1 - ow.gulpT / 7));
            const oeshak = (1 - oprog) * 3 * ow.sc;
            oep.x = ow.x + Math.cos(ow.heading) * 13 * ow.sc + (Math.random() - 0.5) * 2 * oeshak;
            oep.y = ow.y + Math.sin(ow.heading) * 13 * ow.sc + (Math.random() - 0.5) * 2 * oeshak;
            oep.heading = ow.heading + Math.sin(ow.flap * 2) * 0.5 * (1 - oprog);
            oep.sc = Math.max(0.25, ow.preySc * (1 - oprog * 0.75));
          }
          if (ow.gulpT <= 0) {
            if (oep) { const oi = bunnies.indexOf(oep); if (oi !== -1) bunnies.splice(oi, 1); }
            ow.prey = null; ow.state = 'fly'; ow.perch = null; ow.timer = 0;
          }
          continue;
        }
        if (ow.state === 'hunt') {
          const opr = ow.prey;
          if (!opr || !bunnies.includes(opr) || opr.state === 'inside' || opr.state === 'caught') {
            ow.prey = null; ow.state = 'fly'; ow.timer = 1 + Math.random() * 2;
          } else {
            ow.timer -= dt;
            ow.glideT = 0;
            ow.heading = Math.atan2(opr.y - ow.y, opr.x - ow.x);
            const ohdx = opr.x - ow.x, ohdy = opr.y - ow.y;
            if (ohdx * ohdx + ohdy * ohdy < 14 * 14) {
              const feast = pickFreePine(ow);
              if (!feast) {
                opr.state = 'out'; opr.timer = 0.5;
                ow.prey = null; ow.state = 'fly'; ow.timer = 1 + Math.random() * 2;
              } else {
                opr.state = 'caught';
                ow.preySc = opr.sc;
                ow.perch = feast;
                ow.state = 'carry';
                ow.huntCd = 10 + Math.random() * 15;
              }
            } else {
              const worldW = WT * TILE, worldH = HT * TILE;
              ow.x = Math.max(8, Math.min(worldW - 8, ow.x + Math.cos(ow.heading) * 115 * dt));
              ow.y = Math.max(8, Math.min(worldH - 8, ow.y + Math.sin(ow.heading) * 115 * dt));
              if (ow.timer <= 0) { ow.prey = null; ow.state = 'fly'; ow.timer = 1 + Math.random() * 2; }
            }
          }
          continue;
        }
        if (ow.state === 'carry') {
          const opc = ow.prey;
          if (!opc || !bunnies.includes(opc)) {
            ow.prey = null; ow.state = 'fly'; ow.perch = null; ow.timer = 1 + Math.random() * 2;
          } else if (!ow.perch || pineTaken(ow.perch, ow)) {
            opc.state = 'out'; opc.timer = 0.5; opc.sc = ow.preySc;
            ow.prey = null; ow.state = 'fly'; ow.perch = null; ow.timer = 0;
          } else {
            ow.heading = Math.atan2(ow.perch.y - ow.y, ow.perch.x - ow.x);
            const ocdx = ow.perch.x - ow.x, ocdy = ow.perch.y - ow.y;
            if (ocdx * ocdx + ocdy * ocdy < 14 * 14) {
              ow.x = ow.perch.x; ow.y = ow.perch.y;
              ow.gulpT = 7;
              ow.state = 'eat';
            } else {
              const worldW = WT * TILE, worldH = HT * TILE;
              ow.x = Math.max(8, Math.min(worldW - 8, ow.x + Math.cos(ow.heading) * 95 * dt));
              ow.y = Math.max(8, Math.min(worldH - 8, ow.y + Math.sin(ow.heading) * 95 * dt));
              const ohsw = Math.sin(ow.flap * 2.2) * 3 * ow.sc;
              opc.x = ow.x + Math.cos(ow.heading) * 13 * ow.sc - Math.sin(ow.heading) * ohsw + (Math.random() - 0.5) * 5 * ow.sc;
              opc.y = ow.y + Math.sin(ow.heading) * 13 * ow.sc + Math.cos(ow.heading) * ohsw + 3 * ow.sc + (Math.random() - 0.5) * 5 * ow.sc;
              opc.heading = ow.heading + Math.sin(ow.flap * 1.7) * 0.6 + (Math.random() - 0.5) * 0.5;
            }
          }
          continue;
        }
        ow.flap += dt * (ow.glideT > 0 ? 3 : 9);
        if (ow.glideT > 0) ow.glideT -= dt;
        else if (Math.random() < dt * 0.25) ow.glideT = 1.5 + Math.random() * 2.5;
        ow.huntCd -= dt;
        ow.timer -= dt;
        let odx = ow.tx - ow.x, ody = ow.ty - ow.y;
        if (ow.state === 'landing') {
          if (!ow.perch || pineTaken(ow.perch, ow)) {
            ow.state = 'fly'; ow.perch = null; ow.timer = 0;
          } else {
            const opdx = ow.perch.x - ow.x, opdy = ow.perch.y - ow.y;
            if (opdx * opdx + opdy * opdy < 12 * 12) {
              ow.state = 'perch';
              ow.timer = 7 + Math.random() * 9;
              ow.x = ow.perch.x; ow.y = ow.perch.y;
              continue;
            }
            ow.tx = ow.perch.x; ow.ty = ow.perch.y;
            odx = ow.tx - ow.x; ody = ow.ty - ow.y;
          }
        }
        if (ow.state === 'fly') {
          if (ow.timer <= 0 || odx * odx + ody * ody < 40 * 40) {
            ow.timer = 4 + Math.random() * 5;
            let oacted = false;
            if (ow.huntCd <= 0) {
              const oprey = nearestBunny(ow, 380);
              if (oprey) {
                ow.prey = oprey; ow.state = 'hunt'; ow.timer = 8; ow.glideT = 0;
                oacted = true;
              } else ow.huntCd = 5 + Math.random() * 5;
            }
            if (!oacted) {
              let ofree = null;
              if (Math.random() < 0.3) ofree = pickFreePine(ow);
              if (ofree) {
                ow.state = 'landing'; ow.perch = ofree;
                ow.tx = ofree.x; ow.ty = ofree.y;
              } else {
                const ova = Math.random() * Math.PI * 2, ovd = 120 + Math.random() * 280;
                const worldW = WT * TILE, worldH = HT * TILE;
                ow.tx = Math.max(8, Math.min(worldW - 8, ow.x + Math.cos(ova) * ovd));
                ow.ty = Math.max(8, Math.min(worldH - 8, ow.y + Math.sin(ova) * ovd));
              }
            }
            ow.speed = 50 + Math.random() * 25;
            odx = ow.tx - ow.x; ody = ow.ty - ow.y;
          }
        }
        // bank toward the target, swinging home when the snow runs out ahead
        {
          const owant = Math.atan2(ody, odx);
          const olahead = TILE * 2.5;
          const oltx = Math.floor((ow.x + Math.cos(ow.heading) * olahead) / TILE);
          const olty = Math.floor((ow.y + Math.sin(ow.heading) * olahead) / TILE);
          const oedge = !inTiles(oltx, olty) || (snow[tidx(oltx, olty)] !== 1 && ice[tidx(oltx, olty)] !== 1);
          if (oedge) ow.heading += 3.5 * dt;
          else ow.heading += Math.max(-1, Math.min(1, angDiff(owant, ow.heading))) * 2.5 * dt;
          ow.heading += Math.sin(ow.flap * 0.35 + 1.3) * 0.35 * dt;
          let onx = ow.x + Math.cos(ow.heading) * ow.speed * dt;
          let ony = ow.y + Math.sin(ow.heading) * ow.speed * dt;
          const otx = Math.floor(onx / TILE), oty = Math.floor(ony / TILE);
          const oSnow = inTiles(otx, oty) && (snow[tidx(otx, oty)] === 1 || ice[tidx(otx, oty)] === 1);
          if (!oSnow) {
            const ohomeA = Math.atan2((40 + 0.5) * TILE - ow.y, (40 + 0.5) * TILE - ow.x);
            const octx0 = Math.floor(ow.x / TILE), octy0 = Math.floor(ow.y / TILE);
            if (!inTiles(octx0, octy0) || (snow[tidx(octx0, octy0)] !== 1 && ice[tidx(octx0, octy0)] !== 1)) ow.heading = ohomeA;
            else ow.heading += Math.max(-1, Math.min(1, angDiff(ohomeA, ow.heading))) * 3.5 * dt;
            onx = ow.x + Math.cos(ow.heading) * ow.speed * dt;
            ony = ow.y + Math.sin(ow.heading) * ow.speed * dt;
          }
          const worldW = WT * TILE, worldH = HT * TILE;
          ow.x = Math.max(8, Math.min(worldW - 8, onx));
          ow.y = Math.max(8, Math.min(worldH - 8, ony));
        }
      }
      // the parliament holds at 8 (safety net — owls never die or breed)
      owlUpT -= dt;
      if (owlUpT <= 0) {
        owlUpT = 5;
        while (snowyOwls.length < 8 && pineSpots.length) {
          const p = pineSpots[(Math.random() * pineSpots.length) | 0];
          spawnSnowyOwl(p.x, p.y);
        }
      }
      // particles (dots fall, rings expand)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.ring) {
          p.size += 13 * dt / 0.6;
          p.life -= dt;
        } else {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 160 * dt;
          p.life -= dt;
        }
        if (p.life <= 0) particles.splice(i, 1);
      }
      if (particles.length > 260) particles.splice(0, particles.length - 260);
      updateTallies();
    }

    function buildMinimap() {
      mmCanvas = document.createElement('canvas');
      mmCanvas.width = WT;
      mmCanvas.height = HT;
      const c = mmCanvas.getContext('2d');
      for (let y = 0; y < HT; y++) {
        for (let x = 0; x < WT; x++) {
          const i = tidx(x, y);
          const t = tiles[i];
          c.fillStyle =
            t === OCEAN ? '#1a4f9c' :
            t === WATER ? '#5dade2' :
            t === MUD ? '#8a6f4d' :
            t === SAND ? '#f4e285' :
            savannah[i] ? '#e3d17a' :
            snow[i] ? '#eef3f8' : (damp[i] ? '#2b9c55' : '#2c8a4a');
          c.fillRect(x, y, 1, 1);
        }
      }
      // trees read as dark forest dots, palms as lime dots, stumps as brown (mushrooms!)
      for (const tr of trees) {
        const mx = Math.floor(tr.x / TILE), my = Math.floor(tr.y / TILE);
        c.fillStyle = tr.pine ? '#0e2f1c' : (tr.olive ? '#6b7a1f' : '#0a2f14');
        c.fillRect(mx - 0.5, my - 0.5, 2, 2);
      }
      for (const pm of palms) {
        const mx = Math.floor(pm.x / TILE), my = Math.floor(pm.y / TILE);
        c.fillStyle = '#c6f24e';
        c.fillRect(mx - 0.5, my - 0.5, 2, 2);
      }
      for (const st of stumps) {
        const mx = Math.floor(st.x / TILE), my = Math.floor(st.y / TILE);
        c.fillStyle = '#8a4b1f';
        c.fillRect(mx, my, 1, 1);
      }
    }

    // ============ draw (zoomed-in bird's-eye camera) ============
    function draw(now) {
      const t = now / 1000;
      const worldW = WT * TILE, worldH = HT * TILE;
      const viewW = W / ZOOM, viewH = H / ZOOM;
      let camX = player.x - viewW / 2, camY = player.y - viewH / 2;
      camX = worldW > viewW ? Math.max(0, Math.min(worldW - viewW, camX)) : (worldW - viewW) / 2;
      camY = worldH > viewH ? Math.max(0, Math.min(worldH - viewH, camY)) : (worldH - viewH) / 2;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#0b1020';
      ctx.fillRect(0, 0, W, H);
      ctx.setTransform(ZOOM, 0, 0, ZOOM, 0, 0);
      const tx0 = Math.max(0, Math.floor(camX / TILE)), tx1 = Math.min(WT - 1, Math.floor((camX + viewW) / TILE));
      const ty0 = Math.max(0, Math.floor(camY / TILE)), ty1 = Math.min(HT - 1, Math.floor((camY + viewH) / TILE));
      // tiles
      for (let ty = ty0; ty <= ty1; ty++) {
        for (let tx = tx0; tx <= tx1; tx++) {
          const x = tx * TILE - camX, y = ty * TILE - camY;
          const v = thash(tx, ty) - 0.5;
          const i = tidx(tx, ty);
          const tt = tiles[i];
          if (tt === OCEAN) ctx.fillStyle = 'rgb(' + (26 + v * 8 | 0) + ',' + (79 + v * 10 | 0) + ',' + (156 + v * 12 | 0) + ')';
          else if (tt === WATER) ctx.fillStyle = bigLake[i] ? '#3498db' : 'rgb(' + (74 + v * 10 | 0) + ',' + (163 + v * 10 | 0) + ',' + (223 + v * 10 | 0) + ')';
          else if (tt === MUD) ctx.fillStyle = 'rgb(' + (148 + v * 10 | 0) + ',' + (110 + v * 10 | 0) + ',' + (72 + v * 8 | 0) + ')';
          else if (tt === SAND) ctx.fillStyle = 'rgb(' + (244 + v * 8 | 0) + ',' + (226 + v * 8 | 0) + ',' + (133 + v * 8 | 0) + ')';
          else if (savannah[i]) ctx.fillStyle = 'rgb(' + (228 + v * 8 | 0) + ',' + (206 + v * 8 | 0) + ',' + (128 + v * 8 | 0) + ')';
          else if (snow[i]) ctx.fillStyle = 'rgb(' + (238 + v * 8 | 0) + ',' + (243 + v * 6 | 0) + ',' + (248 + v * 4 | 0) + ')';
          else if (damp[i]) ctx.fillStyle = 'rgb(' + (72 + v * 10 | 0) + ',' + (190 + v * 12 | 0) + ',' + (112 + v * 10 | 0) + ')';
          else ctx.fillStyle = 'rgb(' + (79 + v * 14 | 0) + ',' + (208 + v * 14 | 0) + ',' + (122 + v * 12 | 0) + ')';
          ctx.fillRect(x, y, TILE + 1, TILE + 1);
          if (ice[i]) {
            ctx.fillStyle = 'rgba(220, 240, 252, 0.85)';
            ctx.fillRect(x, y, TILE + 1, TILE + 1);
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(x + 6 + v * 8, y + 10);
            ctx.lineTo(x + 18 + v * 8, y + 22);
            ctx.stroke();
          } else if ((tt === OCEAN || tt === WATER) && thash(tx * 3 + 1, ty * 5 + 2) < 0.25) {
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 2;
            const wx = x + 6 + thash(tx, ty) * 20, wy = y + 10 + thash(ty, tx) * 14 + Math.sin(t * 1.6 + tx + ty) * 2;
            ctx.beginPath();
            ctx.moveTo(wx - 5, wy);
            ctx.quadraticCurveTo(wx, wy - 3, wx + 5, wy);
            ctx.stroke();
          }
        }
      }
      const vx0 = camX - 60, vx1 = camX + viewW + 60, vy0 = camY - 60, vy1 = camY + viewH + 60;
      const vis = (x, y) => x > vx0 && x < vx1 && y > vy0 && y < vy1;
      // ground dressing
      for (const d of decor) {
        if (!vis(d.x, d.y)) continue;
        const x = d.x - camX, y = d.y - camY;
        const dsrt = savannah[tidx(Math.floor(d.x / TILE), Math.floor(d.y / TILE))] === 1;
        if (d.kind === 0) {
          // little dark V-pair sprout (tan in the savannah)
          const a1 = ((d.x * 13 + d.y * 7) % 10 - 5) * 0.06;
          ctx.strokeStyle = dsrt ? '#b8a05a' : '#2c7a3d';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x - 3, y);
          ctx.lineTo(x - 4 + a1 * 6, y - 5 - d.s);
          ctx.moveTo(x + 3, y);
          ctx.lineTo(x + 4 + a1 * 6, y - 5 - d.s);
          ctx.stroke();
          ctx.lineCap = 'butt';
        } else if (d.kind === 7) {
          // fan tuft: blades fanning out from one root (tan in the savannah)
          ctx.strokeStyle = dsrt ? '#c2a95e' : '#3d9e4f';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          const n = 5 + (Math.abs((d.x * 3 + d.y * 5) | 0) % 2);
          for (let i = 0; i < n; i++) {
            const f = n === 1 ? 0 : i / (n - 1) - 0.5;
            const hgt = 9 + d.s * 2 + (Math.abs((d.x * 7 + d.y * 11 + i * 13) | 0) % 7);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + f * 6, y - hgt * 0.6, x + f * 12, y - hgt);
            ctx.stroke();
          }
          ctx.lineCap = 'butt';
        } else if (d.kind === 1) {
          const cols = ['#ff8ab5', '#ffd94d', '#ffffff'];
          ctx.fillStyle = cols[(d.x | 0) % 3];
          ctx.beginPath();
          ctx.arc(x, y, d.s * 0.7, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.kind === 2) {
          ctx.fillStyle = 'rgba(0,0,0,0.12)';
          ctx.beginPath();
          ctx.arc(x, y, d.s, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.kind === 3) {
          ctx.fillStyle = ['#e8933c', '#d4a017', '#c0392b'][(d.y | 0) % 3];
          ctx.beginPath();
          ctx.ellipse(x, y, d.s, d.s * 0.6, d.x, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.kind === 4) {
          ctx.strokeStyle = d.s > 3.5 ? '#f7cad9' : '#ffffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, d.s, Math.PI * 0.9, Math.PI * 1.9);
          ctx.stroke();
        } else if (d.kind === 6) {
          // frosty tuft: pale blades out of a snow mound
          ctx.fillStyle = 'rgba(255,255,255,0.95)';
          ctx.beginPath();
          ctx.ellipse(x, y, 7 + d.s, 3.5 + d.s * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#8aa898';
          ctx.lineCap = 'round';
          ctx.lineWidth = 2.5;
          const n = 4 + (Math.abs((d.x * 7 + d.y * 13) | 0) % 3);
          for (let i = 0; i < n; i++) {
            const off = (i / (n - 1) - 0.5) * 10;
            const hgt = 10 + (Math.abs((d.x * 3 + d.y * 5 + i * 11) | 0) % 8);
            const lean = ((Math.abs((d.x + d.y * 2 + i * 7) | 0) % 5) - 2) * 1.2;
            ctx.beginPath();
            ctx.moveTo(x + off * 0.5, y - 1);
            ctx.lineTo(x + off * 0.5 + lean, y - 1 - hgt);
            ctx.stroke();
          }
          ctx.lineCap = 'butt';
        } else {
          // tiny wildflower: five mini petals + sunny heart
          const cols = ['#ff8ab5', '#ffffff', '#ffd94d', '#c084fc'];
          ctx.fillStyle = cols[((d.x + d.y) | 0) % 4];
          const pr = d.s * 0.75;
          for (let pi = 0; pi < 5; pi++) {
            const a = pi / 5 * Math.PI * 2 + d.x;
            ctx.beginPath();
            ctx.arc(x + Math.cos(a) * pr, y + Math.sin(a) * pr, pr * 0.75, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#ffdf3d';
          ctx.beginPath();
          ctx.arc(x, y, pr * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // shoreline sprigs ducks gather: cattails, long grass, fallen sticks
      ctx.save();
      ctx.lineCap = 'round';
      for (const s of sprigSources) {
        if (!vis(s.x, s.y)) continue;
        const x = s.x - camX, y = s.y - camY;
        if (s.kind === 'cattail') {
          // every stalk rises from one base point, sausage on top
          const frac = v => v - Math.floor(v);
          // a couple of blades fanning out at the base
          ctx.strokeStyle = '#35924a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x - 6, y - 6, x - 10, y - 10 - (s.y % 5));
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x + 6, y - 6, x + 10, y - 10 - (s.x % 5));
          ctx.stroke();
          // one headed stalk per blade left, leaning every which way
          for (let i = 0; i < s.stock; i++) {
            const lean = (frac(Math.sin(s.x * 12.9 + i * 78.2) * 4375.5) - 0.5) * 24;
            const h = 26 + frac(Math.sin(s.y * 7.7 + i * 39.4) * 2463.4) * 16;
            const tx = x + lean, ty = y - h;
            ctx.strokeStyle = i % 2 ? '#2f7a3d' : '#35924a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + lean * 0.5, y - h * 0.5, tx, ty);
            ctx.stroke();
            // brown sausage capping the stalk tip
            ctx.strokeStyle = '#6b4a2b';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx, ty + 9);
            ctx.stroke();
            // pale spike poking out the top
            ctx.strokeStyle = '#d9c27a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx, ty - 5);
            ctx.stroke();
          }
        } else if (s.kind === 'grass') {
          ctx.strokeStyle = '#2f9e44';
          ctx.lineWidth = 2;
          for (let i = 0; i < 2 + s.stock; i++) {
            const a = (i / 5 - 0.5) * 1.2 + Math.sin(s.x) * 0.2;
            const hgt = 10 + ((i * 7 + s.y) % 8);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + a * 8, y - hgt * 0.6, x + a * 12, y - hgt);
            ctx.stroke();
          }
        } else if (s.stock > 0) {
          ctx.strokeStyle = '#7a5230';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x - 7, y + 3);
          ctx.lineTo(x + 7, y - 4);
          ctx.stroke();
          ctx.strokeStyle = '#5b3a1e';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + 1, y);
          ctx.lineTo(x + 4, y - 6);
          ctx.stroke();
        }
      }
      ctx.restore();
      // stumps with their stump mushrooms (big + glowy so they're easy to spot/grab)
      for (const st of stumps) {
        if (!vis(st.x, st.y)) continue;
        const x = st.x - camX, y = st.y - camY;
        const hasMush = st.mush.some(m => !m.empty);
        const nearP = Math.hypot(player.x - st.x, player.y - st.y);
        if (hasMush && nearP < 90) {
          ctx.save();
          ctx.globalAlpha = 0.35 + 0.15 * Math.sin(t * 4);
          ctx.strokeStyle = '#ffd94d';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(x, y, st.r + 10, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(x, y + st.r * 0.7, st.r, st.r * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
        // sawn log: dark bark ring, tan heart, growth rings + a little notch
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#3f2412';
        ctx.fillStyle = '#4a2c14';
        ctx.beginPath();
        ctx.arc(x, y, st.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#c9a06a';
        ctx.beginPath();
        ctx.arc(x, y, st.r * 0.72, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(122, 82, 48, 0.85)';
        ctx.lineWidth = 2;
        for (const gr of [0.5, 0.34, 0.2]) {
          ctx.beginPath();
          ctx.arc(x, y, st.r * gr, 0, Math.PI * 2);
          ctx.stroke();
        }
        // little stub notch on the rim
        ctx.strokeStyle = '#3f2412';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        const na = Math.sin(st.x * 0.37) * 1.2 + Math.PI * 0.94;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(na) * st.r * 0.42, y + Math.sin(na) * st.r * 0.42);
        ctx.lineTo(x + Math.cos(na) * st.r * 0.78, y + Math.sin(na) * st.r * 0.78);
        ctx.stroke();
        for (const m of st.mush) {
          if (m.empty) continue;
          const mx = x + m.dx, my = y + m.dy;
          ctx.fillStyle = '#f5ecd7';
          ctx.fillRect(mx - 2, my - 7, 4, 7);
          ctx.fillStyle = '#d62828';
          ctx.beginPath();
          ctx.arc(mx, my - 5, 6, Math.PI, 0);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(mx - 2, my - 7, 1.3, 0, Math.PI * 2);
          ctx.arc(mx + 1.8, my - 5.5, 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // berry bushes (leaves fade if you're right inside; berries stay bright)
      // savannah stick bushes: bare twig stars, nothing to pick
      for (const b of bushes) {
        if (!vis(b.x, b.y)) continue;
        const x = b.x - camX, y = b.y - camY;
        const inside = Math.hypot(player.x - b.x, player.y - b.y) < b.r;
        if (b.stick) {
          ctx.save();
          if (inside) ctx.globalAlpha = 0.6;
          ctx.fillStyle = 'rgba(0,0,0,0.1)';
          ctx.beginPath();
          ctx.ellipse(x, y + 4, b.r * 0.8, b.r * 0.3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#7a5230';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          const arms = 7 + ((b.seed * 3 | 0) % 3);
          for (let i = 0; i < arms; i++) {
            const a = (i / arms) * Math.PI * 2 + b.seed;
            const len = b.r * (0.7 + ((b.seed * (i + 2) | 0) % 5) * 0.1);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len * 0.8 - 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(a) * len * 0.6, y + Math.sin(a) * len * 0.8 * 0.6 - 1);
            ctx.lineTo(x + Math.cos(a + 0.5) * len * 0.85, y + Math.sin(a + 0.5) * len * 0.8 - 3);
            ctx.stroke();
          }
          ctx.restore();
          continue;
        }
        const snowy = snow[tidx(Math.floor(b.x / TILE), Math.floor(b.y / TILE))] === 1;
        const wig = Math.sin(t * 1.8 + b.seed) * 1.2;
        ctx.save();
        if (inside) ctx.globalAlpha = 0.5;
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.beginPath();
        ctx.ellipse(x, y + b.r * 0.7, b.r, b.r * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#1e6e30';
        ctx.fillStyle = '#46b95c';
        ctx.beginPath();
        ctx.arc(x - 8, y + wig * 0.4, b.r * 0.75, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + 8, y - wig * 0.4, b.r * 0.75, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y - 4, b.r * 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(190, 240, 200, 0.9)';
        ctx.beginPath();
        ctx.arc(x - 4, y - 8, b.r * 0.28, 0, Math.PI * 2);
        ctx.fill();
        if (snowy) {
          // snow heaped on top: soft white blobs with berries peeking out
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          ctx.beginPath();
          ctx.arc(x - 5, y - 10, b.r * 0.45, 0, Math.PI * 2);
          ctx.arc(x + 5, y - 11, b.r * 0.38, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.65)';
          ctx.beginPath();
          ctx.arc(x + 1, y - 6, b.r * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        for (let i = 0; i < b.berries; i++) {
          const a = b.seed + i * 2.1;
          const bx2 = x + Math.cos(a) * b.r * 0.5, by2 = y - 4 + Math.sin(a) * b.r * 0.45;
          ctx.fillStyle = i % 2 ? '#ff5d7a' : '#e63950';
          ctx.beginPath();
          ctx.arc(bx2, by2, 3.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.beginPath();
          ctx.arc(bx2 - 1, by2 - 1, 1.1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // fish: dark wigglers under the surface
      for (const f of fishes) {
        if (!vis(f.x, f.y)) continue;
        const x = f.x - camX, y = f.y - camY;
        const wig = Math.sin(t * 8 + f.x * 0.1) * 0.25;
        ctx.save();
        ctx.globalAlpha = Math.max(0, f.fade === undefined ? 1 : f.fade);
        ctx.translate(x, y);
        ctx.rotate(f.heading + wig * 0.3);
        ctx.fillStyle = f.sea ? 'rgba(10, 40, 80, 0.8)' : 'rgba(30, 70, 110, 0.8)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-6, 0);
        ctx.lineTo(-10, -3 + wig * 6);
        ctx.lineTo(-10, 3 + wig * 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      // lilypads floating on the lake + ocean (with the odd flower)
      for (const pad of lilypads) {
        if (!vis(pad.x, pad.y)) continue;
        const bob = Math.sin(t * 1.4 + pad.phase) * 1.5;
        const x = pad.x - camX, y = pad.y - camY + bob * 0.4;
        ctx.fillStyle = 'rgba(10, 60, 40, 0.25)';
        ctx.beginPath();
        ctx.ellipse(x, y + 2, pad.r, pad.r * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pad.sea ? '#2f9e63' : '#37b06a';
        ctx.beginPath();
        ctx.ellipse(x, y, pad.r, pad.r * 0.62, Math.sin(pad.phase) * 0.2, 0, Math.PI * 2);
        ctx.fill();
        // little notch so it reads as a lily pad
        ctx.fillStyle = pad.sea ? 'rgb(26, 79, 156)' : 'rgb(74, 163, 223)';
        const na = pad.phase;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(na) * pad.r, y + Math.sin(na) * pad.r * 0.62);
        ctx.lineTo(x + Math.cos(na + 0.5) * pad.r, y + Math.sin(na + 0.5) * pad.r * 0.62);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.ellipse(x - pad.r * 0.25, y - pad.r * 0.18, pad.r * 0.3, pad.r * 0.16, -0.4, 0, Math.PI * 2);
        ctx.fill();
        if (pad.flower) {
          const fx = x + Math.cos(pad.phase * 2) * pad.r * 0.3, fy = y - 2;
          ctx.fillStyle = '#ff8ab5';
          for (let pi = 0; pi < 5; pi++) {
            const a = pi / 5 * Math.PI * 2 + pad.phase;
            ctx.beginPath();
            ctx.arc(fx + Math.cos(a) * 3, fy + Math.sin(a) * 3, 2.4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#ffdf3d';
          ctx.beginPath();
          ctx.arc(fx, fy, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // duck nests: chunky brown rings with warming eggs (cracks when close!)
      ctx.save();
      ctx.lineCap = 'round';
      for (const nst of nests) {
        if (!vis(nst.x, nst.y)) continue;
        const x = nst.x - camX, y = nst.y - camY;
        const full = Math.min(1, nst.sprigs / nst.need);
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.beginPath();
        ctx.ellipse(x, y + 8, 14, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // ring grows from a twig arc into a full donut as sprigs arrive
        ctx.strokeStyle = '#6e4a22';
        ctx.lineWidth = 4 + 5 * full;
        ctx.beginPath();

        ctx.stroke();
        ctx.strokeStyle = '#a9763f';
        ctx.lineWidth = 2 + 3 * full;
        ctx.beginPath();
        if (full >= 1) ctx.arc(x, y, 12, 0, Math.PI * 2);
        else ctx.arc(x, y, 12, -0.4, -0.4 + Math.PI * 2 * (0.25 + 0.75 * full));
        ctx.stroke();
        nst.eggs.forEach((e, i) => {
          const ex = x - 5 + i * 5, ey = y - 1 + (i % 2) * 2;
          ctx.fillStyle = '#fdf6e3';
          ctx.beginPath();
          ctx.ellipse(ex, ey, 3.4, 4.4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(150,120,80,0.6)';
          ctx.lineWidth = 1;
          ctx.stroke();
          if (e.age > 45) {
            ctx.strokeStyle = '#6b4a2b';
            ctx.beginPath();
            ctx.moveTo(ex - 2, ey - 2);
            ctx.lineTo(ex, ey);
            ctx.lineTo(ex + 2, ey - 1);
            ctx.stroke();
          }
        });
      }
      ctx.restore();
      // duck business (melts away after 30 seconds)
      for (const poo of poos) {
        if (!vis(poo.x, poo.y)) continue;
        const x = poo.x - camX, y = poo.y - camY;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, (30 - poo.age) / 5));
        ctx.fillStyle = '#6b4a2b';
        ctx.beginPath();
        ctx.ellipse(x, y, 4.5, 3.4, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4e3319';
        ctx.beginPath();
        ctx.ellipse(x - 0.5, y - 0.5, 2.4, 1.8, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.arc(x - 1.5, y - 1.2, 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      // ducks: tail, round body, drake ring, beak, eyes, feet ashore
      for (const d of ducks) {
        if (!vis(d.x, d.y)) continue;
        const x = d.x - camX, y = d.y - camY;
        const bob = d.paused ? Math.sin(t * 1.5 + d.x) * 1 : Math.sin(t * 5 + d.x) * 0.8;
        const dtile = tileAtPx(d.x, d.y);
        const ashore = dtile !== WATER && dtile !== OCEAN;
        const gulp = d.gulpT > 0 ? 1 + d.gulpT * 0.5 : 1;
        ctx.save();
        ctx.globalAlpha = Math.max(0, d.fade);
        ctx.translate(x, y + bob * 0.4);
        ctx.rotate(d.heading + Math.sin(t * 2 + d.x) * 0.04);
        ctx.scale(d.sc * gulp, d.sc * gulp);
        // watery / dusty shadow
        ctx.fillStyle = ashore ? 'rgba(0,0,0,0.2)' : 'rgba(10,40,80,0.25)';
        ctx.beginPath();
        ctx.ellipse(-1, 1, 9, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        // orange feet paddle out ashore
        if (ashore) {
          const pad = d.paused ? 0 : Math.sin(t * 10 + d.x) * 1.5;
          ctx.fillStyle = '#e8912d';
          ctx.beginPath();
          ctx.ellipse(-1, -6 - pad * 0.3, 3, 1.8, 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(-1, 6 + pad * 0.3, 3, 1.8, -0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        // tail feathers
        ctx.fillStyle = d.body;
        ctx.beginPath();
        ctx.moveTo(-6, 0);
        ctx.lineTo(-12, -3.5);
        ctx.lineTo(-12, 3.5);
        ctx.closePath();
        ctx.fill();
        // round body + shaded heart
        ctx.fillStyle = d.body;
        ctx.beginPath();
        ctx.ellipse(0, 0, 8, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 5, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();
        // drake's cream neck ring
        if (d.drake) {
          ctx.fillStyle = '#f2f2ee';
          ctx.beginPath();
          ctx.ellipse(5, 0, 1.8, 3.8, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // head + orange beak
        ctx.fillStyle = d.head;
        ctx.beginPath();
        ctx.arc(8.5, 0, 3.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f0a22e';
        ctx.beginPath();
        ctx.moveTo(11.5, -1.8);
        ctx.lineTo(14.5, 0);
        ctx.lineTo(11.5, 1.8);
        ctx.closePath();
        ctx.fill();
        // two sprigs riding home in the beak
        if (d.carry) {
          ctx.strokeStyle = '#2f9e44';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(14, 0);
          ctx.lineTo(19, -3);
          ctx.moveTo(14, 0);
          ctx.lineTo(19, 3);
          ctx.stroke();
          ctx.fillStyle = '#40b355';
          ctx.beginPath();
          ctx.ellipse(19.5, -3.5, 2, 1, 0.6, 0, Math.PI * 2);
          ctx.ellipse(19.5, 3.5, 2, 1, -0.6, 0, Math.PI * 2);
          ctx.fill();
        }
        // a caught fish flailing above the water
        if (d.holding) {
          const fl = Math.sin(t * 30 + d.holding.seed) * 0.5;
          ctx.save();
          ctx.translate(13, -6 + fl * 2);
          ctx.rotate(-0.7 + fl * 0.5);
          ctx.fillStyle = 'rgba(140,190,225,0.95)';
          ctx.beginPath();
          ctx.ellipse(0, 0, 6, 2.4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-5, 0);
          ctx.lineTo(-8.5, -2.5 + fl * 3);
          ctx.lineTo(-8.5, 2.5 + fl * 3);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#0d2c5e';
          ctx.beginPath();
          ctx.arc(3.5, -1, 0.9, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        // one dark eye each side
        ctx.fillStyle = '#141414';
        ctx.beginPath();
        ctx.arc(9.5, -2, 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(9.5, 2, 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      // fluffy yellow chicks, still growing
      for (const c of chicks) {
        if (!vis(c.x, c.y)) continue;
        const x = c.x - camX, y = c.y - camY;
        const bob = Math.sin(t * 6 + c.x) * 1;
        const ctile = tileAtPx(c.x, c.y);
        const cashore = ctile !== WATER && ctile !== OCEAN;
        ctx.save();
        ctx.translate(x, y + bob * 0.4);
        ctx.rotate(c.heading);
        ctx.scale(c.sc, c.sc);
        ctx.fillStyle = cashore ? 'rgba(0,0,0,0.2)' : 'rgba(10,40,80,0.25)';
        ctx.beginPath();
        ctx.ellipse(0, 1, 7, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        if (cashore) {
          ctx.fillStyle = '#e8912d';
          ctx.beginPath();
          ctx.ellipse(-1, -5, 2.4, 1.5, 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(-1, 5, 2.4, 1.5, -0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#f2d35c';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(6, -1, 3.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f7e08a';
        ctx.beginPath();
        ctx.ellipse(1, 1.5, 3.2, 2.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f0a22e';
        ctx.beginPath();
        ctx.moveTo(8.5, -2);
        ctx.lineTo(10.5, -1);
        ctx.lineTo(8.5, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#141414';
        ctx.beginPath();
        ctx.arc(6.5, -2.5, 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(6.5, 0.5, 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      // beach shells: loose ones crabs fetch, plus stashed piles at each burrow
      for (const s of shells) {
        if (s.state === 'carried') continue;
        const sx = (s.state === 'stored' ? s.hx : s.x), sy = (s.state === 'stored' ? s.hy : s.y);
        if (!vis(sx, sy)) continue;
        const x = sx - camX, y = sy - camY + Math.sin(t * 2 + s.bob) * 0.8;
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(x, y + 2, 4.5, 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = s.tint || '#ffffff';
        ctx.fillStyle = s.tint || '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, 4, Math.PI * 0.9, Math.PI * 1.9);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 4, Math.PI * 0.9, Math.PI * 1.9);
        ctx.fill();
        ctx.strokeStyle = 'rgba(150,110,90,0.8)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - 2, y - 1);
        ctx.lineTo(x + 2, y - 1);
        ctx.moveTo(x - 1, y - 3);
        ctx.lineTo(x + 1, y - 3);
        ctx.stroke();
      }
      // crabs: sideways scuttlers that haul shells home, claws + legs + eye stalks
      for (const h of crabHoles) {
        const hx = h.x - camX, hy = h.y - camY;
        ctx.save();
        ctx.globalAlpha = Math.max(0, h.fade === undefined ? 1 : h.fade);
        if (vis(h.x, h.y)) {
          ctx.fillStyle = 'rgba(90, 60, 30, 0.8)';
          ctx.beginPath();
          ctx.ellipse(hx, hy, 5, 3.5, 0, 0, Math.PI * 2);
          ctx.fill();
          // stashed shell count ring: a tiny shell pile already drawn, plus a glint if stocked
          if (h.stash > 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = '9px sans-serif';
            ctx.fillText('🐚x' + h.stash, hx + 8, hy + 4);
          }
        }
        if (h.state !== 'hidden' && vis(h.cx, h.cy)) {
          const x = h.cx - camX, y = h.cy - camY;
          const wig = Math.sin(t * 11 + h.x * 0.1) * 1.2;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(h.heading);
          // six striding legs with a wiggle
          ctx.strokeStyle = '#a93226';
          ctx.lineWidth = 1.5;
          for (let l = -1; l <= 1; l++) {
            ctx.beginPath();
            ctx.moveTo(l * 3, -3);
            ctx.lineTo(l * 4 + wig, -7);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(l * 3, 3);
            ctx.lineTo(l * 4 - wig, 7);
            ctx.stroke();
          }
          // twin claws up front (raised high when carrying a shell home!)

      // minimap top-right: terrain + you
      if (mmCanvas) {
        const mw = 150, mx = Math.max(8, W - mw - 14), my = 74;
        ctx.fillStyle = 'rgba(13, 19, 27, 0.93)';
        ctx.fillRect(mx - 3, my - 3, mw + 6, mw + 6);
        ctx.drawImage(mmCanvas, mx, my, mw, mw);
        const px = mx + (player.x / (WT * TILE)) * mw;
        const py = my + (player.y / (HT * TILE)) * mw;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // ============ main loop (runs right away — no start screen) ============
    function loop(now) {
      if (!running) return;
      let dt = (now - lastT) / 1000;
      lastT = now;
      if (dt > 0.05) dt = 0.05;
      update(dt, now);
      draw(now);
      rafId = requestAnimationFrame(loop);
    }

    // ============ boot: fixed world, straight into the game ============
    genWorld(FIXED_SEED);
    updateTallies();
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
    window.addEventListener('pagehide', () => cancelAnimationFrame(rafId));
  </script>
</body>
</html>
